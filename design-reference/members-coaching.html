<title>Raeng Members Area</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;800&display=swap">
<style>
/* Layout: app-like members area; slim header with avatar, three views (Home / Book / Plan) switched by a bottom tab bar; one ink card per view carries the weight, everything else on hairlines */
:root{
  color-scheme:light;
  --bg:#faf6ee; --ink:#151515; --rule:#cfcbc2; --muted:#5d5a54; --soft:#e8e4db; --paper:#ffffff;
  --display:"Archivo","Helvetica Neue",Arial,sans-serif;
  --body:"Archivo","Helvetica Neue",Arial,sans-serif;
}
/* Single light look to match the Raeng site in every theme */
:root{color-scheme:light}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.5}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
button{font:inherit;color:inherit}
p,h1,h2,h3{margin:0}
.muted{color:var(--muted)}
.gut{padding-left:max(20px,env(safe-area-inset-left,0px));padding-right:max(20px,env(safe-area-inset-right,0px))}
:focus-visible{outline:2px solid var(--ink);outline-offset:3px}

/* Header */
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);border-bottom:1px solid var(--rule)}
.bar{max-width:620px;margin:0 auto;height:60px;display:grid;grid-template-columns:44px 1fr 44px;align-items:center}
.icon-btn{all:unset;cursor:pointer;width:44px;height:44px;display:grid;place-items:center;border-radius:50%}
.icon-btn svg{width:22px;height:22px;stroke:var(--ink);fill:none;stroke-width:1.8;stroke-linecap:round}
.mark{text-align:center;font-weight:800;letter-spacing:.34em;font-size:17px;padding-left:.34em}
.mark small{display:block;font-size:9px;font-weight:600;letter-spacing:.4em;color:var(--muted);margin-top:-2px}
.avatar{all:unset;cursor:pointer;justify-self:end;width:36px;height:36px;border-radius:50%;background:var(--ink);color:var(--bg);display:grid;place-items:center;font-weight:700;font-size:15px}

/* Views */
main{max-width:620px;margin:0 auto;padding-top:28px;padding-bottom:calc(110px + env(safe-area-inset-bottom,0px))}
.view{display:flex;flex-direction:column;gap:28px;animation:fade .35s both}
.eyebrow{font-size:12px;font-weight:600;letter-spacing:.3em;text-transform:uppercase;color:var(--muted)}
h1{font-family:var(--display);font-weight:800;font-size:clamp(30px,8.4vw,42px);letter-spacing:-.035em;line-height:1.05;text-wrap:balance}
h2{font-size:13px;font-weight:600;letter-spacing:.24em;text-transform:uppercase;color:var(--muted)}
.head{display:flex;flex-direction:column;gap:8px}
.demo{display:inline-flex;align-self:flex-start;font-size:11px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;padding:4px 10px;border-radius:999px;border:1px dashed var(--rule);color:var(--muted)}

/* Next class card */
.next{background:var(--ink);color:var(--bg);border-radius:24px;padding:22px 22px 18px;display:flex;flex-direction:column;gap:14px}
.next .lbl{font-size:12px;font-weight:600;letter-spacing:.24em;text-transform:uppercase;opacity:.7}
.next .when{font-family:var(--display);font-weight:800;font-size:clamp(26px,7.4vw,34px);letter-spacing:-.03em;line-height:1.08}
.next .where{opacity:.75;font-size:15px}
.next .row{display:flex;justify-content:space-between;align-items:center;gap:12px;border-top:1px solid color-mix(in srgb,var(--bg) 22%,transparent);padding-top:14px;flex-wrap:wrap}
.count{font-variant-numeric:tabular-nums;font-weight:600}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{all:unset;cursor:pointer;font-size:14px;font-weight:600;padding:8px 14px;border-radius:999px;border:1px solid color-mix(in srgb,var(--bg) 40%,transparent)}
.chip:hover{background:var(--bg);color:var(--ink)}
.empty-next{border:1.5px dashed var(--rule);border-radius:24px;padding:24px;display:flex;flex-direction:column;gap:12px;align-items:flex-start}

/* Credits */
.credits{display:grid;grid-template-columns:96px 1fr;gap:20px;align-items:center;padding-block:4px}
.ring{width:96px;height:96px}
.ring .track{fill:none;stroke:var(--soft);stroke-width:8}
.ring .fill{fill:none;stroke:var(--ink);stroke-width:8;stroke-linecap:round;transform:rotate(-90deg);transform-origin:50% 50%;transition:stroke-dashoffset .7s cubic-bezier(.2,.8,.2,1)}
.ring text{fill:var(--ink);font-family:"Archivo",Arial,sans-serif;font-weight:800;font-size:28px;font-variant-numeric:tabular-nums}
.ring .of{font-size:11px;font-weight:600;fill:var(--muted);letter-spacing:1px}
.credits div{display:flex;flex-direction:column;gap:2px;min-width:0}
.credits b{font-size:18px;letter-spacing:-.01em}
.credits .small{font-size:14px}

/* Lists */
.list{list-style:none;margin:0;padding:0;border-top:1px solid var(--rule)}
.list li{display:flex;justify-content:space-between;align-items:center;gap:12px;padding-block:16px;border-bottom:1px solid var(--rule);min-width:0}
.list .t{display:flex;flex-direction:column;min-width:0}
.list .t b{font-weight:600}
.list .t span{font-size:14px;color:var(--muted)}
.link{all:unset;cursor:pointer;font-weight:600;font-size:15px;border-bottom:1.5px solid var(--ink)}
.empty{color:var(--muted);padding-block:16px;border-bottom:1px solid var(--rule)}
.section{display:flex;flex-direction:column;gap:12px}
.section-head{display:flex;justify-content:space-between;align-items:baseline}

/* Book view */
.weeks{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;margin-inline:-4px;padding:4px}
.weeks::-webkit-scrollbar{display:none}
.wk{all:unset;cursor:pointer;flex:none;padding:10px 16px;border-radius:999px;border:1.5px solid var(--rule);font-size:14px;font-weight:600;white-space:nowrap;transition:background .25s,color .25s,border-color .25s}
.wk[aria-selected="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.slots{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.slot{all:unset;cursor:pointer;position:relative;display:flex;flex-direction:column;align-items:center;gap:2px;padding:18px 6px 14px;border:1.5px solid var(--ink);border-radius:20px;text-align:center;min-width:0;transition:transform .15s,background .25s,color .25s}
.slot:active{transform:scale(.97)}
.slot .d{font-size:12px;font-weight:600;letter-spacing:.2em}
.slot .n{font-family:var(--display);font-weight:800;font-size:clamp(26px,7.6vw,34px);letter-spacing:-.03em;line-height:1.1;font-variant-numeric:tabular-nums}
.slot .tm{font-size:14px}
.slot .st{margin-top:8px;font-size:11px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;padding:3px 9px;border-radius:999px;border:1px solid currentColor;white-space:nowrap}
.slot.booked{background:var(--ink);color:var(--bg)}
.slot.past{border-color:var(--rule);color:var(--muted);cursor:default;border-style:dashed}
.slot.past:active{transform:none}
.slot.out{border-color:var(--rule);color:var(--muted)}
.hint{font-size:14px;color:var(--muted)}

/* Plan view */
.plan-card{border:1.5px solid var(--ink);border-radius:24px;padding:22px;display:flex;flex-direction:column;gap:6px}
.plan-card .nm{font-family:var(--display);font-weight:800;font-size:28px;letter-spacing:-.03em}
.period{display:flex;flex-direction:column;gap:8px;margin-top:12px}
.track-bar{height:6px;border-radius:99px;background:var(--soft);overflow:hidden}
.track-bar i{display:block;height:100%;background:var(--ink);border-radius:99px}
.period .ends{display:flex;justify-content:space-between;font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.kv{list-style:none;margin:0;padding:0;border-top:1px solid var(--rule)}
.kv li{display:flex;justify-content:space-between;gap:16px;padding-block:14px;border-bottom:1px solid var(--rule)}
.kv span{color:var(--muted)}
.kv b{font-weight:600;text-align:right;min-width:0;overflow-wrap:anywhere}

/* Train view (online coaching clients only) */
.wkbar{display:grid;gap:4px;margin-top:4px}
.wkbar i{height:6px;border-radius:99px;background:var(--soft)}
.wkbar i.f{background:var(--ink)}
.wkbar i.c{background:repeating-linear-gradient(90deg,var(--ink) 0 4px,var(--soft) 4px 7px)}
.strip{display:flex;justify-content:space-between;align-items:center;gap:6px 16px;flex-wrap:wrap;padding-block:12px;border-block:1px solid var(--rule);font-size:14px;margin-block:-8px}
.strip b{font-variant-numeric:tabular-nums}
.strip .link{font-size:14px}
.wk .ok{display:inline-block;width:7px;height:7px;border-radius:50%;background:currentColor;margin-left:8px;vertical-align:middle}
.ex-list{list-style:none;margin:0;padding:0;border-top:1px solid var(--rule)}
.ex{padding-block:20px;border-bottom:1px solid var(--rule);display:flex;flex-direction:column;gap:12px}
.ex-top{display:grid;grid-template-columns:28px 1fr;gap:12px;align-items:start}
.ex-no{font-weight:800;font-size:14px;font-variant-numeric:tabular-nums;width:28px;height:28px;border-radius:50%;border:1.5px solid var(--ink);display:grid;place-items:center;transition:background .25s,color .25s}
.ex.all .ex-no{background:var(--ink);color:var(--bg)}
.ex-t{display:flex;flex-direction:column;gap:3px;min-width:0}
.ex-t b{font-size:19px;font-weight:800;letter-spacing:-.02em;line-height:1.2}
.ex-t .rx{font-weight:600;font-variant-numeric:tabular-nums}
.ex-t .cue{font-size:14px;color:var(--muted)}
.ex-meta{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;padding-left:40px;font-size:13px}
.ex-meta .last{color:var(--muted);font-variant-numeric:tabular-nums}
.demo-link{color:var(--ink);font-weight:600;font-size:14px;text-decoration:none;border-bottom:1.5px solid var(--ink)}
.no-demo{font-size:13px;color:var(--muted)}
.sets{display:flex;flex-direction:column;gap:8px;padding-left:40px}
.set{display:grid;grid-template-columns:22px minmax(0,1fr) minmax(0,1fr) 40px;gap:8px;align-items:center}
.set .sn{font-size:13px;font-weight:600;color:var(--muted);font-variant-numeric:tabular-nums}
.num{position:relative;display:block;min-width:0}
.num input{all:unset;box-sizing:border-box;width:100%;height:44px;padding:0 44px 0 12px;border:1.5px solid var(--rule);border-radius:12px;background:var(--paper);font-size:16px;font-weight:600;font-variant-numeric:tabular-nums;transition:border-color .2s}
.num input:focus{border-color:var(--ink)}
.num em{position:absolute;right:10px;top:50%;transform:translateY(-50%);font-style:normal;font-size:12px;color:var(--muted);pointer-events:none;white-space:nowrap}
.done{all:unset;cursor:pointer;width:40px;height:40px;border-radius:50%;border:1.5px solid var(--ink);display:grid;place-items:center;transition:background .2s,transform .15s}
.done:active{transform:scale(.9)}
.done svg{width:18px;height:18px;fill:none;stroke:var(--bg);stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round;opacity:0}
.done[aria-pressed="true"]{background:var(--ink)}
.done[aria-pressed="true"] svg{opacity:1}
.set.is-done .num input{border-color:var(--soft);color:var(--muted)}
.field{display:flex;flex-direction:column;gap:6px}
.field label,.field .lbl{font-size:13px;font-weight:600;letter-spacing:.06em;color:var(--muted)}
.field textarea,.field input{all:unset;box-sizing:border-box;width:100%;padding:12px 14px;border:1.5px solid var(--rule);border-radius:14px;background:var(--paper);font-size:16px;line-height:1.45;transition:border-color .2s}
.field textarea{min-height:84px;white-space:pre-wrap}
.field textarea:focus,.field input:focus{border-color:var(--ink)}
.finish{display:flex;flex-direction:column;gap:14px}
.finish .btn{flex:none}
.logged{border:1.5px dashed var(--rule);border-radius:24px;padding:20px;display:flex;flex-direction:column;gap:10px}
.logged ul{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:4px;font-variant-numeric:tabular-nums}
.logged .note{font-size:14px;color:var(--muted)}
.reply{border-left:2px solid var(--ink);padding:2px 0 2px 14px;display:flex;flex-direction:column;gap:4px}
.reply span{font-size:13px;color:var(--muted)}
.scale{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.scale button{all:unset;cursor:pointer;text-align:center;height:44px;border-radius:12px;border:1.5px solid var(--rule);font-weight:700;font-variant-numeric:tabular-nums;transition:background .2s,color .2s,border-color .2s}
.scale button[aria-checked="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.scale-ends{display:flex;justify-content:space-between;font-size:12px;color:var(--muted)}
.sheet.tall{max-height:92vh;overflow-y:auto;overscroll-behavior:contain}
.sheet .in.form{gap:18px}

/* ---- Coaching area: premium space with an inverted palette and a brass accent ---- */
:root{--brass:#b8925a}
body{transition:background-color .45s,color .45s}
body.coach{--bg:#131312;--ink:#f4efe4;--rule:#34322e;--muted:#a19b90;--soft:#26241f;--paper:#1c1b19;--brass:#d2ad72}
.mark small.co{color:var(--brass)}
.brass{color:var(--brass)}
.ccard{all:unset;box-sizing:border-box;cursor:pointer;position:relative;overflow:hidden;background:#131312;color:#f4efe4;border-radius:24px;padding:22px;display:flex;flex-direction:column;gap:8px;border:1px solid color-mix(in srgb,var(--brass) 60%,transparent);transition:transform .15s}
.ccard:active{transform:scale(.99)}
.ccard .lbl{font-size:11px;font-weight:600;letter-spacing:.3em;text-transform:uppercase;color:var(--brass)}
.ccard .ttl{font-weight:800;font-size:clamp(24px,6.8vw,30px);letter-spacing:-.03em;line-height:1.1;max-width:15ch;text-wrap:balance}
.ccard .sub{font-size:15px;color:#c9c3b8;max-width:30ch}
.ccard .go{display:flex;justify-content:space-between;align-items:center;gap:12px;border-top:1px solid #34322e;padding-top:14px;margin-top:6px;font-weight:600;font-size:15px}
.ccard .go em{font-style:normal;color:#a19b90;font-weight:500;font-size:14px}
.ccard .kb{position:absolute;right:-14px;top:-8px;width:120px;height:120px;fill:none;stroke:var(--brass);stroke-width:1.1;opacity:.3;pointer-events:none}
.ccard.sm{margin-top:12px;padding:16px 18px;border-radius:20px;gap:2px}
.ccard.sm .ttl{font-size:18px;max-width:none}
.ccard.sm .sub{font-size:13px}
.ccard.sm .kb{width:78px;height:78px;right:-8px;top:-6px}
.lockic{display:inline-flex;align-items:center;gap:8px}
.lockic svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round}
.btn.brass{background:var(--brass);border-color:var(--brass);color:#131312}
.avatar.pro{box-shadow:0 0 0 2px var(--bg),0 0 0 3.5px var(--brass)}
.ptag{display:inline-flex;align-self:flex-start;font-size:10px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;padding:2px 8px;border-radius:999px;border:1px solid var(--brass);color:var(--brass);margin-top:3px}
/* Unlock page */
.preview{position:relative;border:1px solid var(--rule);border-radius:24px;padding:18px;overflow:hidden;background:var(--paper)}
.preview .blur{filter:blur(3.5px);opacity:.75;pointer-events:none;user-select:none;display:flex;flex-direction:column;gap:14px}
.preview .pv b{display:block;font-weight:800;font-size:17px}
.preview .pv span{font-size:13px;color:var(--muted)}
.preview .pv i{display:block;height:34px;border-radius:10px;border:1.5px solid var(--rule);margin-top:8px}
.preview .lockc{position:absolute;inset:0;display:grid;place-items:center;background:radial-gradient(closest-side,color-mix(in srgb,var(--bg) 55%,transparent),transparent)}
.preview .lockc span{display:inline-flex;gap:8px;align-items:center;background:var(--ink);color:var(--bg);padding:11px 18px;border-radius:999px;font-weight:600;font-size:14px}
.preview .lockc svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round}
.perks{list-style:none;margin:0;padding:0;border-top:1px solid var(--rule)}
.perks li{display:grid;grid-template-columns:34px 1fr;gap:14px;align-items:start;padding-block:16px;border-bottom:1px solid var(--rule)}
.perks svg{width:24px;height:24px;fill:none;stroke:var(--brass);stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round;margin-top:1px}
.perks b{display:block;font-weight:700}
.perks span{color:var(--muted);font-size:14px}
.how{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:18px}
.how li{display:grid;grid-template-columns:34px 1fr;gap:14px}
.how .n{font-size:13px;font-weight:700;color:var(--brass);font-variant-numeric:tabular-nums;padding-top:2px}
.how b{display:block;font-weight:700}
.how span{color:var(--muted);font-size:14px}
.price{border:1px solid var(--brass);border-radius:24px;padding:22px;display:flex;flex-direction:column;gap:6px}
.price .amt{font-weight:800;font-size:46px;letter-spacing:-.04em;line-height:1}
.price .amt small{font-size:16px;font-weight:600;letter-spacing:0;color:var(--muted);margin-left:6px}
.cta-bar{position:fixed;left:0;right:0;bottom:0;z-index:6;background:color-mix(in srgb,var(--bg) 90%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-top:1px solid var(--rule);padding:12px max(20px,env(safe-area-inset-right,0px)) calc(12px + env(safe-area-inset-bottom,0px)) max(20px,env(safe-area-inset-left,0px))}
.cta-bar[hidden],.tabs[hidden]{display:none}
.cta-bar .in{max-width:620px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;gap:14px}
.cta-bar .in div{display:flex;flex-direction:column;line-height:1.25}
.cta-bar b{font-size:17px}
.cta-bar span{font-size:13px;color:var(--muted)}
.cta-bar .btn{flex:none;padding:14px 22px;text-decoration:none}
/* Programme */
.wlist{list-style:none;margin:0;padding:0;border-top:1px solid var(--rule)}
.wlist>li{padding-block:16px;border-bottom:1px solid var(--rule);display:flex;flex-direction:column;gap:14px}
.wrow{display:flex;justify-content:space-between;align-items:center;gap:12px}
.wrow div{display:flex;flex-direction:column;min-width:0}
.wrow b{font-weight:700}
.wrow span{font-size:14px;color:var(--muted)}
.wlist li.future .wrow b{color:var(--muted)}
.tag{flex:none;font-size:11px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;padding:3px 9px;border-radius:999px;border:1px solid currentColor;color:var(--muted);white-space:nowrap}
.tag.now{color:var(--brass)}
.tag.ok{color:var(--ink)}
.pday{all:unset;box-sizing:border-box;cursor:pointer;display:grid;grid-template-columns:1fr auto;align-items:center;gap:2px 12px;padding:14px 16px;border:1px solid var(--rule);border-radius:16px;width:100%}
.pday b{font-weight:700}
.pday span{font-size:14px;color:var(--muted);grid-column:1}
.pday .tag{grid-column:2;grid-row:1 / span 2}
.pdays{display:flex;flex-direction:column;gap:8px}
/* Check-in history and messages */
.cihist{list-style:none;margin:0;padding:0;border-top:1px solid var(--rule)}
.cihist li{padding-block:16px;border-bottom:1px solid var(--rule);display:flex;flex-direction:column;gap:10px}
.cihist .sc{display:flex;gap:16px;font-size:14px;color:var(--muted);font-variant-numeric:tabular-nums;flex-wrap:wrap}
.cihist .sc b{color:var(--ink)}
.thread{display:flex;flex-direction:column;gap:8px}
.msg{max-width:84%;padding:11px 14px;border-radius:18px;font-size:15px;line-height:1.45;overflow-wrap:anywhere}
.msg.them{align-self:flex-start;background:var(--soft);border-bottom-left-radius:6px}
.msg.me{align-self:flex-end;background:var(--ink);color:var(--bg);border-bottom-right-radius:6px}
.msg small{display:block;font-size:11px;opacity:.6;margin-top:4px}
.sep{align-self:center;font-size:12px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);padding:10px 0 4px}
.composer{display:grid;grid-template-columns:1fr 48px;gap:8px;align-items:end}
.composer textarea{all:unset;box-sizing:border-box;width:100%;min-height:48px;max-height:140px;padding:12px 16px;border:1.5px solid var(--rule);border-radius:24px;background:var(--paper);font-size:16px;line-height:1.4;white-space:pre-wrap}
.composer textarea:focus{border-color:var(--ink)}
.send{all:unset;cursor:pointer;width:48px;height:48px;border-radius:50%;background:var(--ink);display:grid;place-items:center}
.send svg{width:20px;height:20px;fill:none;stroke:var(--bg);stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.tabs .tab{position:relative}
.tab .dot{position:absolute;top:8px;left:calc(50% + 7px);width:8px;height:8px;border-radius:50%;background:var(--brass);box-shadow:0 0 0 2px var(--bg)}
/* Plan: add coaching */
.compare{display:grid;grid-template-columns:1fr 1fr;gap:10px}

<script>

  const WEEK_DAYS={
    'Day A':[['swing',5,'10','24 kg',''],['goblet',4,'8','20 kg',''],['press',4,'5 each','16 kg','Last set: pause 2 s at the top.'],['carry',3,'40 m each','24 kg','']],

    book(){

          return '<li class="ex'+(all?' all':'')+'" data-ex="'+i+'"><div class="ex-top"><span class="ex-no">'+(i+1)+'</span><div class="ex-t"><b>'+esc(e.name)+'</b><span class="rx">'+sets+' × '+esc(reps)+' · '+esc(load)+'</span><span class="cue">'+esc(e.cue)+(note?' '+esc(note):'')+'</span></div></div>'+

          '<div class="pdays">'+Object.keys(WEEK_DAYS).map(d=>'<button class="pday" data-pday="'+d+'"><b>'+d+'</b><span>'+WEEK_DAYS[d].map(x=>(EXLIB[x[0]]||{name:x[0]}).name).join(', ')+'</span><span class="tag'+(DAYLOG[d]?' ok':'')+'">'+(DAYLOG[d]?'Logged':'To do')+'</span></button>').join('')+'</div></li>';

  const TABSVG={home:'<path d="M4 11 12 4l8 7v9h-5v-6H9v6H4z"/>',book:'<rect x="4" y="5" width="16" height="15" rx="3"/><path d="M4 10h16M9 3v4M15 3v4M10 15l1.5 1.5L15 13"/>',plan:'<circle cx="12" cy="12" r="8"/><path d="M12 4a8 8 0 0 1 8 8h-8z"/>',
    today:'<path d="M9 8.5a3 3 0 1 1 6 0"/><path d="M8.2 8.5h7.6l1.7 9.2a2 2 0 0 1-2 2.3H8.5a2 2 0 0 1-2-2.3z"/>',prog:'<rect x="4" y="4" width="7" height="7" rx="1.5"/><rect x="13" y="4" width="7" height="7" rx="1.5"/><rect x="4" y="13" width="7" height="7" rx="1.5"/><rect x="13" y="13" width="7" height="7" rx="1.5"/>',
    check:'<rect x="5" y="4" width="14" height="17" rx="2.5"/><path d="M9 4.5V3h6v1.5M9 12l2 2 4-4M9 17h6"/>',msg:'<path d="M4 5h16v11H9l-5 4z"/>'};
  const MTABS=[['home','Home','home'],['book','Book','book'],['plan','Plan','plan']];
  const CTABS=[['c-today','Today','today'],['c-programme','Programme','prog'],['c-checkin','Check-in','check'],['c-messages','Messages','msg']];
  const MENU_SVG='<svg viewBox="0 0 24 24"><path d="M4 8h16M4 16h11"/></svg>',BACK_SVG='<svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg>';
  let tabSet='';
  function renderChrome(){
    const cm=inCoach(view),set=view==='unlock'?null:(cm?CTABS:MTABS);
    document.body.classList.toggle('coach',cm);
    const ms=$('#markSub');ms.textContent=cm?'COACHING':'MEMBERS';ms.classList.toggle('co',cm);
    menuBtn.innerHTML=cm?BACK_SVG:MENU_SVG;menuBtn.setAttribute('aria-label',cm?'Back to members area':'Open members menu');
    $('#tabs').hidden=!set;$('#ctaBar').hidden=view!=='unlock';
    if(set){
      const id=set===CTABS?'c':'m';
      if(tabSet!==id){tabSet=id;$('#tabsIn').style.setProperty('--n',set.length);
        $('#tabsIn').innerHTML='<span class="tab-ind" id="tabInd" aria-hidden="true"></span>'+set.map(([v,l,ic])=>'<button class="tab" role="tab" data-view="'+v+'"><svg viewBox="0 0 24 24">'+TABSVG[ic]+'</svg>'+l+'</button>').join('')}
      document.querySelectorAll('.tab').forEach((t,i)=>{const on=t.dataset.view===view;t.setAttribute('aria-selected',on);if(on)$('#tabInd').style.transform='translateX('+(i*100)+'%)';
        const d=t.querySelector('.dot');if(t.dataset.view==='c-messages'&&unread&&!d)t.insertAdjacentHTML('beforeend','<b class="dot" aria-label="New message"></b>');else if(d&&(!unread||t.dataset.view!=='c-messages'))d.remove()});
    }
    // Coaching status: brass ring on the avatar, tag in the account menu
    [av,$('#acctAv')].forEach(a=>a.classList.toggle('pro',ME.coaching));
    $('#acctSub').innerHTML=PLAN.name+' member'+(ME.coaching?' · <span class="brass">Coaching</span>':'');
    $('#acctCoach').textContent=ME.coaching?'Week '+COACHING.week:'Unlock';
  }
  function render(){
    main.innerHTML='<div class="view">'+views[view]()+'</div>';
    renderChrome();
    document.querySelectorAll('.mnav button').forEach(b=>b.dataset.go===view?b.setAttribute('aria-current','page'):b.removeAttribute('aria-current'));
    renderDrawer();
  }
  function go(v){v=norm(v);const was=view;view=v;try{history.replaceState(null,'','#'+v)}catch(e){location.hash=v}render();closeDrawer();
    if(v==='c-messages')window.scrollTo(0,document.body.scrollHeight);else window.scrollTo({top:0,behavior:inCoach(was)!==inCoach(v)?'auto':'smooth'})}

  // Drawer
  const drawer=$('#drawer'),scrim=$('#scrim'),menuBtn=$('#menuBtn');
  function openDrawer(){drawer.classList.add('on');scrim.classList.add('on');drawer.setAttribute('aria-hidden','false');menuBtn.setAttribute('aria-expanded','true')}
  function closeDrawer(){drawer.classList.remove('on');if(!sheet.classList.contains('on'))scrim.classList.remove('on');drawer.setAttribute('aria-hidden','true');menuBtn.setAttribute('aria-expanded','false')}
  menuBtn.addEventListener('click',()=>{if(inCoach(view))go('home');else openDrawer()});
  // ---- Left drawer: three layouts to compare ----
  let layout='c';
  const MAP='https://www.google.com/maps/search/?api=1&query=Media%20House%2C%201A%20Dunns%20Wood%20Road%2C%20Cumbernauld%2C%20G67%203EN';
  const IG='https://www.instagram.com/alex.kbells/', SITE='https://raengfitness.vercel.app/';
  const siteLinks=[['classes','Classes'],['memberships','Memberships'],['coaching','1:1 Coaching'],['online-coaching','Online Coaching'],['about','About RAENG']];
  const ico={cal:'<rect x="4" y="5" width="16" height="15" rx="3"/><path d="M4 10h16M9 3v4M15 3v4M10 15l1.5 1.5L15 13"/>',list:'<path d="M8 6h12M8 12h12M8 18h12M4 6h.01M4 12h.01M4 18h.01"/>',ring:'<circle cx="12" cy="12" r="8"/><path d="M12 4a8 8 0 0 1 8 8h-8z"/>',pin:'<path d="M12 21s7-7 7-12a7 7 0 0 0-14 0c0 5 7 12 7 12z"/><circle cx="12" cy="9" r="2.5"/>',chat:'<path d="M4 5h16v11H9l-5 4z"/>',bell:'<path d="M9 8.5a3 3 0 1 1 6 0"/><path d="M8.2 8.5h7.6l1.7 9.2a2 2 0 0 1-2 2.3H8.5a2 2 0 0 1-2-2.3z"/>',check:'<rect x="5" y="4" width="14" height="17" rx="2.5"/><path d="M9 4.5V3h6v1.5M9 12l2 2 4-4M9 17h6"/>'};
  function renderDrawer(){
    const nx=upcoming()[0], l=left();
    const head='<div class="who"><span class="avatar" aria-hidden="true">N</span><div><b>'+ME.name+'</b><span>'+PLAN.name+' · '+l+' credits left</span></div></div>';
    let h='';
    if(layout==='a'){
      h=head+'<div class="mnav"><button data-go="home"'+(view==='home'?' aria-current="page"':'')+'>Home <span>Next class</span></button><button data-go="book"'+(view==='book'?' aria-current="page"':'')+'>Book a class <span>'+l+' credits</span></button><button data-go="plan"'+(view==='plan'?' aria-current="page"':'')+'>My plan <span>Renews 24 Nov</span></button>'+'<button data-go="coaching">Coaching <span class="brass">'+(ME.coaching?'Week '+COACHING.week:'Unlock')+'</span></button>'+'</div>'+
        '<details><summary>Help</summary><div class="site"><a href="'+IG+'" target="_blank" rel="noopener">Message Alex on Instagram</a><a href="'+MAP+'" target="_blank" rel="noopener">Directions to Media House</a></div></details>'+
        '<details><summary>Website</summary><div class="site">'+siteLinks.map(([p,t])=>'<a href="'+SITE+p+'">'+t+'</a>').join('')+'</div></details>';
    }else if(layout==='b'){
      h=head+'<div class="grp"><h4>Train</h4><button data-go="book">Book a class <span>'+l+' credits</span></button><button data-go="home">My bookings <span>'+upcoming().length+' upcoming</span></button>'+'<button data-go="coaching">Raeng Coaching <span class="brass">'+(ME.coaching?tr.day:'Unlock')+'</span></button>'+'</div>'+
        '<div class="grp"><h4>Membership</h4><button data-go="plan">Plan and credits <span>'+PLAN.name+'</span></button><a href="'+SITE+'memberships">Change plan <span>→</span></a></div>'+
        '<div class="grp"><h4>The club</h4><a href="'+SITE+'classes">Timetable</a><a href="'+SITE+'coaching">1:1 Coaching</a><a href="'+SITE+'online-coaching">Online Coaching</a><a href="'+SITE+'about">About RAENG</a></div>'+
        '<div class="grp" style="border-bottom:0"><h4>Get in touch</h4><a href="'+IG+'" target="_blank" rel="noopener">Message Alex <span>Instagram</span></a><a href="'+MAP+'" target="_blank" rel="noopener">Directions <span>Media House</span></a></div>';
    }else{
      const foot=siteLinks.filter(([p])=>!(ME.coaching&&p==='online-coaching')).map(([p,t])=>'<a href="'+SITE+p+'">'+t+'</a>').join('')+'<a href="'+MAP+'" target="_blank" rel="noopener">Directions</a>';
      h=head+'<p class="dh">Up next</p>'+
        (nx?'<button class="mini" data-go="home"><small>Next class</small><b>'+fmt(nx,{weekday:'short',day:'numeric',month:'short'})+', '+timeLbl(nx)+'</b><span>'+until(nx)+' · Media House</span></button>':'<div class="mini"><small>Next class</small><b>Nothing booked</b><span>'+l+' credits to use</span></div>')+
        coachCard(true)+
        '<p class="dh">Shortcuts</p>'+
        '<div class="tiles"><button class="tile pri" data-go="book"><svg viewBox="0 0 24 24">'+ico.cal+'</svg>Book a class</button><button class="tile" data-go="home"><svg viewBox="0 0 24 24">'+ico.list+'</svg>My bookings</button><button class="tile" data-go="plan"><svg viewBox="0 0 24 24">'+ico.ring+'</svg>Plan and credits</button><a class="tile" href="'+IG+'" target="_blank" rel="noopener"><svg viewBox="0 0 24 24">'+ico.chat+'</svg>Message Alex</a></div>'+
        '<p class="dh">Raeng</p><div class="foot-links">'+foot+'</div>';
    }
    // Demo only: preview the app as a member with or without coaching
    h+='<div class="dlayout"><p>Demo: view as</p><div class="seg" style="grid-template-columns:1fr 1fr"><button data-demo="member" aria-pressed="'+!ME.coaching+'">Member</button><button data-demo="client" aria-pressed="'+ME.coaching+'">Coaching client</button></div></div>';
    $('#dbody').innerHTML=h;
  }

  // ---- Account menu (top right) ----
  const acct=$('#acct'),av=$('#avatarBtn');
  function placeAcct(){const r=av.getBoundingClientRect();acct.style.top=(r.bottom+10)+'px';acct.style.right=Math.max(12,innerWidth-r.right)+'px'}
  function openAcct(){closeDrawer();placeAcct();acct.classList.add('on');acct.setAttribute('aria-hidden','false');av.setAttribute('aria-expanded','true');acct.querySelector('[role=menuitem]').focus()}
  function closeAcct(){acct.classList.remove('on');acct.setAttribute('aria-hidden','true');av.setAttribute('aria-expanded','false')}
  av.addEventListener('click',e=>{e.stopPropagation();acct.classList.contains('on')?closeAcct():openAcct()});
  document.addEventListener('click',e=>{if(acct.classList.contains('on')&&!acct.contains(e.target)&&e.target!==av)closeAcct()});
  addEventListener('resize',()=>{if(acct.classList.contains('on'))placeAcct()});
  acct.addEventListener('keydown',e=>{const items=[...acct.querySelectorAll('[role=menuitem]')],i=items.indexOf(document.activeElement);if(e.key==='ArrowDown'){e.preventDefault();items[(i+1)%items.length].focus()}if(e.key==='ArrowUp'){e.preventDefault();items[(i-1+items.length)%items.length].focus()}});
  acct.addEventListener('click',e=>{const b=e.target.closest('[data-acct]');if(!b)return;const a=b.dataset.acct;closeAcct();
    if(a==='plan')go('plan');
    else if(a==='coach')go('coaching');
    else if(a==='out')toast('Signed out (example)');
    else toast({profile:'Profile and details (example)',notify:'Notification settings (example)',cal:'Connect Apple or Google Calendar (example)',security:'Sign-in and security (example)',help:'Help and contact (example)'}[a]);
    av.focus();});

  // Sheet
  const sheet=$('#sheet');let pending=null;
  function openSheet(mode,k){
    pending={mode,k};const d=new Date(k+':00Z');
    $('#sheetEyebrow').textContent=mode==='book'?'Book with a credit':'Cancel booking';
    $('#sheetTitle').textContent=longLbl(d);
    $('#sheetBody').textContent=mode==='book'?'Uses 1 of your '+left()+' credits. Kettlebell training at Media House, Cumbernauld.':'Your place is released for someone else.';
    $('#sheetYes').textContent=mode==='book'?'Book it':'Cancel booking';
    $('#sheetNo').textContent=mode==='book'?'Not now':'Keep it';
    sheet.classList.add('on');scrim.classList.add('on');sheet.setAttribute('aria-hidden','false');$('#sheetYes').focus();
  }
  function closeSheet(){sheet.classList.remove('on');scrim.classList.remove('on');sheet.setAttribute('aria-hidden','true');pending=null}
  $('#sheetNo').addEventListener('click',closeSheet);
  $('#sheetYes').addEventListener('click',()=>{
    if(!pending)return;const d=new Date(pending.k+':00Z');
    if(pending.mode==='book'){booked.add(pending.k);toast('Booked: '+fmt(d,{weekday:'short',day:'numeric',month:'short'})+', '+timeLbl(d))}
    else{booked.delete(pending.k);toast('Booking cancelled')}
    closeSheet();render();
  });
  // ---- Train sheet (check-in, finish session, message coach) ----
  const ts=$('#tsheet'),tsBody=$('#tsBody');let tsOnOk=null;
  function openT(html,onOk){
    closeDrawer();tsBody.innerHTML='<span class="grab" aria-hidden="true"></span>'+html;tsOnOk=onOk;
    ts.classList.add('on');scrim.classList.add('on');ts.setAttribute('aria-hidden','false');ts.scrollTop=0;
    const f=tsBody.querySelector('[data-autofocus]')||tsBody.querySelector('[data-ts="ok"]');if(f)setTimeout(()=>f.focus({preventScroll:true}),60);
  }
  function closeT(){ts.classList.remove('on');scrim.classList.remove('on');ts.setAttribute('aria-hidden','true');tsOnOk=null}
  tsBody.addEventListener('click',e=>{
    const b=e.target.closest('[data-ts]');if(!b)return;
    if(b.dataset.ts==='no')closeT();else if(tsOnOk&&tsOnOk()!==false)closeT();
  });
  const tsBtns=(no,ok)=>'<div class="btns"><button class="btn" data-ts="no">'+no+'</button><button class="btn solid" data-ts="ok">'+ok+'</button></div>';

  function openFinish(){
    const day=tr.day,d=doneSets(day),t=totalSets(day);
    openT('<p class="eyebrow">Finish session</p><h3 id="tsTitle">Week '+COACHING.week+' · '+day+'</h3><p class="muted">'+d+' of '+t+' sets ticked.'+(d<t?' Unticked sets are saved as missed.':'')+' This goes straight to '+COACHING.coach+'.</p>'+tsBtns('Keep going','Log session'),
    ()=>{
      // → insert workout_logs (week, day, note) + set_logs (load, reps, done) for each set
      const items=WEEK_DAYS[day].map(([id,sets,reps,load],i)=>{
        const done=Array.from({length:sets},(_,s)=>setState(day,i,s+1)).filter(x=>x.done);
        if(!done.length)return null;
        const [,ru]=qty(reps),[,lu]=qty(load),top=done.reduce((m,x)=>Math.max(m,parseFloat(x.load)||0),0);
        return (EXLIB[id]||{name:id}).name+' '+done.length+' × '+done[0].reps+(ru==='reps'?'':' '+ru)+(top?' · '+top+' '+lu:'');
      }).filter(Boolean);
      DAYLOG[day]={when:TODAY_LBL,note:tr.note.trim(),items:items.length?items:['No sets ticked']};
      HISTORY.unshift({day:'Week '+COACHING.week+' · '+day,when:TODAY_LBL,sets:d+' sets'});
      Object.keys(tr.sets).forEach(k=>{if(k.startsWith(day+'|'))delete tr.sets[k]});tr.note='';
      toast('Session logged. '+COACHING.coach+' can see it.');render();window.scrollTo({top:0,behavior:'smooth'});
    });
  }

  // Train view interactions
  main.addEventListener('input',e=>{
    const i=e.target;
    if(i.dataset.k){const [day,ix,s]=i.dataset.k.split('|');setState(day,+ix,+s)[i.dataset.f]=i.value}
    else if(i.id==='trNote')tr.note=i.value;
    else if(i.id==='ciWins')ci.wins=i.value;else if(i.id==='ciStr')ci.struggles=i.value;else if(i.id==='ciVid')ci.video=i.value;
    if(i.id==='msgTxt'){i.style.height='auto';i.style.height=Math.min(140,i.scrollHeight+3)+'px'}
  });
  document.addEventListener('click',e=>{
    const t=e.target.closest('[data-day],[data-done],[data-finish],[data-relog],[data-pday],[data-score],[data-cisend],[data-msgsend],[data-demo]');if(!t||ts.contains(t))return;
    if(t.dataset.day!==undefined&&t.dataset.day){tr.day=t.dataset.day;render()}
    else if(t.dataset.done){
      const k=t.dataset.done,[day,ix,s]=k.split('|'),st=setState(day,+ix,+s);st.done=!st.done;
      t.setAttribute('aria-pressed',st.done);t.closest('.set').classList.toggle('is-done',st.done);
      const li=t.closest('.ex'),n=WEEK_DAYS[day][+ix][1];
      li.classList.toggle('all',Array.from({length:n},(_,j)=>setState(day,+ix,j+1).done).every(Boolean));
      const p=$('#trProg');if(p)p.textContent=doneSets(day)+' of '+totalSets(day)+' sets';
      if(st.done&&navigator.vibrate)try{navigator.vibrate(10)}catch(_){}
    }
    else if(t.hasAttribute('data-finish'))openFinish();
    else if(t.dataset.pday){tr.day=t.dataset.pday;go('c-today')}
    else if(t.dataset.score){const [k,n]=t.dataset.score.split('|');ci[k]=+n;t.parentElement.querySelectorAll('button').forEach(b=>b.setAttribute('aria-checked',b===t))}
    else if(t.hasAttribute('data-cisend')){
      if(!ci.energy||!ci.sleep||!ci.training){toast('Pick 1–5 for energy, sleep and training');return}
      if(ci.video.trim()&&!/^https?:\/\/\S+\.\S+/.test(ci.video.trim())){toast('That video link doesn\'t look right');$('#ciVid').focus();return}
      // → insert into check_ins (client_id, energy, sleep, training, wins, struggles, video_url)
      COACHING.checkSent=TODAY_LBL;toast('Check-in sent to '+COACHING.coach);render();window.scrollTo({top:0,behavior:'smooth'});
    }
    else if(t.hasAttribute('data-msgsend')){
      const box=$('#msgTxt'),txt=box.value.trim();if(!txt){box.focus();return}
      // → insert into messages (client_id, from_client, body); shows in the coach Inbox
      MSGS.push({me:true,t:txt,when:TODAY_LBL});render();window.scrollTo(0,document.body.scrollHeight);$('#msgTxt').focus();
    }
    else if(t.dataset.demo){ME.coaching=t.dataset.demo==='client';toast(ME.coaching?'Viewing as a coaching client':'Viewing as a member without coaching');view=norm(view);render()}
    else if(t.hasAttribute('data-relog')){delete DAYLOG[tr.day];render()}
  });

  scrim.addEventListener('click',()=>{closeSheet();closeT();closeDrawer()});
  document.addEventListener('keydown',e=>{if(e.key==='Escape'){if(acct.classList.contains('on')){closeAcct();av.focus()}closeSheet();closeT();closeDrawer()}});

  // Toast
  let tt;function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('on');clearTimeout(tt);tt=setTimeout(()=>t.classList.remove('on'),2200)}

  // Delegated clicks
  document.addEventListener('click',e=>{
    const t=e.target.closest('[data-view],[data-go],[data-week],[data-slot],[data-cancel],[data-act]');if(!t)return;
    if(t.dataset.view)go(t.dataset.view);
    else if(t.dataset.go)go(t.dataset.go);
    else if(t.dataset.week){week=+t.dataset.week;render()}
    else if(t.dataset.cancel)openSheet('cancel',t.dataset.cancel);
    else if(t.dataset.act==='cal')toast('Calendar file ready (example)');
    else if(t.dataset.slot){
      const k=t.dataset.slot,d=new Date(k+':00Z');
      if(d<=NOW)return;
      if(booked.has(k))openSheet('cancel',k);
      else if(d>PERIOD.end)toast('Opens when your plan renews');
      else if(left()<1)toast('No credits left this period');
      else openSheet('book',k);
    }
  });
  addEventListener('hashchange',()=>{const v=norm(location.hash.slice(1));if(views[v]&&v!==view){view=v;render()}});
  render();
})();
</script>
