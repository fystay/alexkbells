<title>Raeng Coach Dashboard</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;800&display=swap">
<style>
/* Layout: same shell as the members area; four tabs (Today / Schedule / Members / Inbox); one ink card per view, everything else on hairlines; sheets for detail */
:root{
  color-scheme:light;
  --bg:#faf6ee; --ink:#151515; --rule:#cfcbc2; --muted:#5d5a54; --soft:#ebe6dc; --paper:#ffffff;
  --warn:#9a5b12; --warn-bg:#f6e7d2; --ok:#2f6b3f; --ok-bg:#e1eedf;
  --display:"Archivo","Helvetica Neue",Arial,sans-serif;
  --body:"Archivo","Helvetica Neue",Arial,sans-serif;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.5}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
button,input{font:inherit;color:inherit}
p,h1,h2,h3,h4{margin:0}
.muted{color:var(--muted)}
.gut{padding-left:max(20px,env(safe-area-inset-left,0px));padding-right:max(20px,env(safe-area-inset-right,0px))}
:focus-visible{outline:2px solid var(--ink);outline-offset:3px}
a{color:var(--ink)}

/* Header */
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);border-bottom:1px solid var(--rule)}
.bar{max-width:720px;margin:0 auto;height:60px;display:grid;grid-template-columns:44px 1fr 44px;align-items:center}
.icon-btn{all:unset;cursor:pointer;width:44px;height:44px;display:grid;place-items:center;border-radius:50%}
.icon-btn svg{width:22px;height:22px;stroke:var(--ink);fill:none;stroke-width:1.8;stroke-linecap:round}
.mark{text-align:center;font-weight:800;letter-spacing:.34em;font-size:17px;padding-left:.34em}
.mark small{display:block;font-size:9px;font-weight:600;letter-spacing:.4em;color:var(--muted);margin-top:-2px}
.avatar{all:unset;cursor:pointer;justify-self:end;width:36px;height:36px;border-radius:50%;background:var(--ink);color:var(--bg);display:grid;place-items:center;font-weight:700;font-size:15px}
.avatar[aria-expanded="true"]{box-shadow:0 0 0 3px var(--bg),0 0 0 4.5px var(--ink)}

/* Views */
main{max-width:720px;margin:0 auto;padding-top:28px;padding-bottom:calc(110px + env(safe-area-inset-bottom,0px))}
.view{display:flex;flex-direction:column;gap:28px;animation:fade .35s both}
.eyebrow{font-size:12px;font-weight:600;letter-spacing:.3em;text-transform:uppercase;color:var(--muted)}
h1{font-family:var(--display);font-weight:800;font-size:clamp(30px,8.4vw,42px);letter-spacing:-.035em;line-height:1.05;text-wrap:balance}
h2{font-size:13px;font-weight:600;letter-spacing:.24em;text-transform:uppercase;color:var(--muted)}
.head{display:flex;flex-direction:column;gap:8px}
.demo{display:inline-flex;align-self:flex-start;font-size:11px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;padding:4px 10px;border-radius:999px;border:1px dashed var(--rule);color:var(--muted)}
.section{display:flex;flex-direction:column;gap:12px}
.section-head{display:flex;justify-content:space-between;align-items:baseline;gap:12px}
.link{all:unset;cursor:pointer;font-weight:600;font-size:15px;border-bottom:1.5px solid var(--ink)}

/* Stat strip */
.stats{display:grid;grid-template-columns:repeat(3,1fr);border-top:1px solid var(--rule);border-bottom:1px solid var(--rule)}
.stats button{all:unset;cursor:pointer;display:flex;flex-direction:column;gap:2px;padding:14px 10px 14px 0;min-width:0}
.stats button+button{padding-left:14px;border-left:1px solid var(--rule)}
.stats strong{font-family:var(--display);font-weight:800;font-size:28px;letter-spacing:-.02em;line-height:1.1;font-variant-numeric:tabular-nums}
.stats span{font-size:13px;color:var(--muted);line-height:1.3}

/* Session card */
.session{background:var(--ink);color:var(--bg);border-radius:24px;padding:22px 22px 18px;display:flex;flex-direction:column;gap:14px}
.session .lbl{font-size:12px;font-weight:600;letter-spacing:.24em;text-transform:uppercase;opacity:.7}
.session .when{font-family:var(--display);font-weight:800;font-size:clamp(26px,7.4vw,34px);letter-spacing:-.03em;line-height:1.08}
.cap{display:flex;flex-direction:column;gap:8px}
.cap-bar{display:grid;gap:3px}
.cap-bar i{height:8px;border-radius:2px;background:color-mix(in srgb,var(--bg) 22%,transparent)}
.cap-bar i.f{background:var(--bg)}
.cap-txt{display:flex;justify-content:space-between;font-size:14px;opacity:.85;font-variant-numeric:tabular-nums}
.session .row{display:flex;gap:8px;flex-wrap:wrap;border-top:1px solid color-mix(in srgb,var(--bg) 22%,transparent);padding-top:14px}
.chip{all:unset;cursor:pointer;font-size:14px;font-weight:600;padding:9px 15px;border-radius:999px;border:1px solid color-mix(in srgb,var(--bg) 40%,transparent)}
.chip.solid{background:var(--bg);color:var(--ink);border-color:var(--bg)}

/* Roster */
.roster{list-style:none;margin:0;padding:0;border-top:1px solid var(--rule)}
.roster li{display:grid;grid-template-columns:40px 1fr auto;gap:12px;align-items:center;padding-block:12px;border-bottom:1px solid var(--rule)}
.ini{width:40px;height:40px;border-radius:50%;background:var(--soft);display:grid;place-items:center;font-weight:700;font-size:14px}
.who{display:flex;flex-direction:column;min-width:0}
.who b{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.who span{font-size:13px;color:var(--muted)}
.tag{display:inline-block;font-size:11px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;padding:2px 8px;border-radius:999px;margin-left:6px;vertical-align:1px}
.tag.new{background:var(--ink);color:var(--bg)}
.tag.warn{background:var(--warn-bg);color:var(--warn)}
.tag.ok{background:var(--ok-bg);color:var(--ok)}
.check{all:unset;cursor:pointer;width:44px;height:44px;border-radius:50%;border:1.5px solid var(--rule);display:grid;place-items:center;transition:background .2s,border-color .2s}
.check svg{width:20px;height:20px;fill:none;stroke:var(--bg);stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round;opacity:0;transform:scale(.6);transition:opacity .2s,transform .25s cubic-bezier(.3,1.5,.5,1)}
.check[aria-pressed="true"]{background:var(--ink);border-color:var(--ink)}
.check[aria-pressed="true"] svg{opacity:1;transform:none}

/* Generic list */
.list{list-style:none;margin:0;padding:0;border-top:1px solid var(--rule)}
.list li{display:flex;justify-content:space-between;align-items:center;gap:12px;padding-block:14px;border-bottom:1px solid var(--rule);min-width:0}
.list .t{display:flex;flex-direction:column;min-width:0}
.list .t b{font-weight:600}
.list .t span{font-size:14px;color:var(--muted)}
.rowbtn{all:unset;cursor:pointer;display:grid;grid-template-columns:40px 1fr auto;gap:12px;align-items:center;width:100%;padding-block:12px;border-bottom:1px solid var(--rule)}
.rowbtn .r{text-align:right;font-size:14px;font-variant-numeric:tabular-nums}
.rowbtn .r small{display:block;color:var(--muted);font-size:12px}
.pill-btn{all:unset;cursor:pointer;font-size:14px;font-weight:600;padding:8px 14px;border-radius:999px;border:1.5px solid var(--ink);white-space:nowrap}
.pill-btn.solid{background:var(--ink);color:var(--bg)}

/* Schedule */
.weeks{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;margin-inline:-4px;padding:4px}
.weeks::-webkit-scrollbar{display:none}
.wk{all:unset;cursor:pointer;flex:none;padding:10px 16px;border-radius:999px;border:1.5px solid var(--rule);font-size:14px;font-weight:600;white-space:nowrap}
.wk[aria-selected="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.slot{all:unset;cursor:pointer;display:grid;grid-template-columns:64px 1fr auto;gap:14px;align-items:center;padding:16px 0;border-bottom:1px solid var(--rule);width:100%}
.slot .date{display:flex;flex-direction:column;align-items:center;border:1.5px solid var(--ink);border-radius:16px;padding:8px 0}
.slot .date small{font-size:11px;font-weight:600;letter-spacing:.18em}
.slot .date b{font-family:var(--display);font-size:24px;font-weight:800;line-height:1.1}
.slot.pt .date{border-style:dashed}
.slot.past{opacity:.55}
.slot.cancelled .info b{text-decoration:line-through}
.slot .info{display:flex;flex-direction:column;gap:6px;min-width:0}
.mini-bar{display:grid;gap:2px;max-width:180px}
.mini-bar i{height:5px;border-radius:2px;background:var(--soft)}
.mini-bar i.f{background:var(--ink)}
.slot .n{font-variant-numeric:tabular-nums;font-weight:600;font-size:15px;text-align:right}
.slot .n small{display:block;font-size:12px;color:var(--muted);font-weight:500}

/* Members */
.search{display:flex;align-items:center;gap:10px;border:1.5px solid var(--rule);border-radius:999px;padding:0 16px;background:var(--paper)}
.search svg{width:18px;height:18px;fill:none;stroke:var(--muted);stroke-width:2;flex:none}
.search input{all:unset;flex:1;min-width:0;padding:12px 0}
.filters{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;margin-inline:-4px;padding:4px}
.filters::-webkit-scrollbar{display:none}
.filters button{all:unset;cursor:pointer;flex:none;padding:8px 14px;border-radius:999px;border:1.5px solid var(--rule);font-size:14px;font-weight:600;white-space:nowrap}
.filters button[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.filters em{font-style:normal;opacity:.6;margin-left:4px;font-variant-numeric:tabular-nums}
.empty{color:var(--muted);padding-block:16px;border-bottom:1px solid var(--rule)}

/* Inbox */
.ibx{display:flex;flex-direction:column;gap:10px;padding:16px 0;border-bottom:1px solid var(--rule)}
.ibx .top{display:flex;justify-content:space-between;gap:12px;align-items:baseline}
.ibx .kind{font-size:11px;font-weight:600;letter-spacing:.2em;text-transform:uppercase;color:var(--muted)}
.ibx .age{font-size:13px;color:var(--muted);white-space:nowrap}
.ibx .acts{display:flex;gap:8px;flex-wrap:wrap}

/* Tab bar */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:6;background:color-mix(in srgb,var(--bg) 90%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-top:1px solid var(--rule);padding-bottom:env(safe-area-inset-bottom,0px)}
.tabs .in{max-width:720px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr);position:relative}
.tab{all:unset;cursor:pointer;position:relative;display:flex;flex-direction:column;align-items:center;gap:3px;padding:10px 0 12px;font-size:12px;font-weight:600;color:var(--muted)}
.tab svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.tab[aria-selected="true"]{color:var(--ink)}
.tab .badge{position:absolute;top:6px;left:calc(50% + 6px);min-width:18px;height:18px;padding:0 5px;border-radius:999px;background:var(--ink);color:var(--bg);font-size:11px;display:grid;place-items:center;font-variant-numeric:tabular-nums}
.tab-ind{position:absolute;top:-1px;left:0;width:25%;height:2px;display:flex;justify-content:center;transition:transform .45s cubic-bezier(.3,1.3,.5,1)}
.tab-ind::after{content:"";width:28px;height:2px;background:var(--ink);border-radius:2px}

/* Drawer (Action layout) */
.scrim{position:fixed;inset:0;z-index:20;background:rgba(10,10,10,.38);opacity:0;pointer-events:none;transition:opacity .3s}
.scrim.on{opacity:1;pointer-events:auto}
.drawer{position:fixed;top:0;bottom:0;left:0;z-index:21;width:min(340px,86vw);background:var(--bg);transform:translateX(-102%);transition:transform .4s cubic-bezier(.2,.8,.2,1);display:flex;flex-direction:column;padding:calc(18px + env(safe-area-inset-top,0px)) 22px calc(22px + env(safe-area-inset-bottom,0px)) max(22px,env(safe-area-inset-left,0px));overflow-y:auto}
.drawer.on{transform:none}
.dwho{display:flex;gap:14px;align-items:center;padding-bottom:18px;border-bottom:1px solid var(--rule)}
.dwho .avatar{width:46px;height:46px;font-size:18px;cursor:default}
.dwho div{display:flex;flex-direction:column;min-width:0}
.dwho b{font-size:17px}
.dwho span{font-size:14px;color:var(--muted)}
.mini{margin-top:16px;background:var(--ink);color:var(--bg);border-radius:20px;padding:16px 18px;display:flex;flex-direction:column;gap:2px;border:0;font:inherit;text-align:left;cursor:pointer;width:100%}
.mini small{font-size:11px;font-weight:600;letter-spacing:.2em;text-transform:uppercase;opacity:.7}
.mini b{font-size:18px;letter-spacing:-.01em}
.mini span{font-size:13px;opacity:.75}
.bigbtn{all:unset;cursor:pointer;margin-top:12px;text-align:center;padding:15px;border-radius:999px;border:1.5px solid var(--ink);font-weight:700}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px;margin-bottom:24px}
.tile{all:unset;cursor:pointer;display:flex;flex-direction:column;gap:10px;padding:14px;border-radius:18px;background:var(--soft);font-size:14px;font-weight:600;color:var(--ink)}
.tile svg{width:22px;height:22px;fill:none;stroke:var(--ink);stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.foot-links{display:flex;flex-wrap:wrap;gap:6px 14px;margin-top:auto;padding-top:18px;border-top:1px solid var(--rule);font-size:14px}
.foot-links a{color:var(--muted);text-decoration:none}

/* Account menu */
.acct{position:fixed;z-index:22;width:min(300px,calc(100vw - 24px));background:var(--paper);border:1px solid var(--rule);border-radius:20px;box-shadow:0 18px 40px -12px rgba(20,18,14,.25);padding:8px;opacity:0;transform:translateY(-6px) scale(.97);transform-origin:top right;pointer-events:none;transition:opacity .2s,transform .25s cubic-bezier(.2,.8,.2,1)}
.acct.on{opacity:1;transform:none;pointer-events:auto}
.acct-head{display:flex;gap:12px;align-items:center;padding:10px 10px 14px;border-bottom:1px solid var(--rule);margin-bottom:6px}
.acct-head .avatar{width:40px;height:40px;cursor:default;font-size:17px}
.acct-head div{display:flex;flex-direction:column;min-width:0}
.acct-head b{font-size:16px}
.acct-head span{font-size:13px;color:var(--muted)}
.acct [role="menuitem"]{all:unset;box-sizing:border-box;cursor:pointer;width:100%;display:flex;align-items:center;gap:12px;padding:11px 10px;border-radius:12px;font-size:15px;font-weight:500;color:var(--ink)}
.acct [role="menuitem"]:hover,.acct [role="menuitem"]:focus-visible{background:var(--soft);outline:none}
.acct [role="menuitem"] svg{width:19px;height:19px;flex:none;fill:none;stroke:var(--ink);stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.acct [role="menuitem"] em{margin-left:auto;font-style:normal;font-size:12px;color:var(--muted)}
.acct hr{border:0;border-top:1px solid var(--rule);margin:6px 0}
.acct .out{color:var(--muted)}

/* Sheet */
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:21;background:var(--paper);border-radius:26px 26px 0 0;transform:translateY(105%);transition:transform .4s cubic-bezier(.2,.8,.2,1);padding:12px max(22px,env(safe-area-inset-right,0px)) calc(22px + env(safe-area-inset-bottom,0px)) max(22px,env(safe-area-inset-left,0px));max-height:88vh;overflow-y:auto}
.sheet.on{transform:none}
.sheet .in{max-width:620px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
.grab{width:40px;height:4px;border-radius:4px;background:var(--rule);align-self:center;margin-bottom:6px}
.sheet h3{font-family:var(--display);font-weight:800;font-size:26px;letter-spacing:-.03em;line-height:1.1}
.btns{display:flex;gap:10px;margin-top:6px;flex-wrap:wrap}
.btn{all:unset;cursor:pointer;flex:1;text-align:center;padding:14px 20px;border-radius:999px;font-weight:600;border:1.5px solid var(--ink);white-space:nowrap}
.btn.solid{background:var(--ink);color:var(--bg)}
.btn.quiet{border-color:var(--rule);color:var(--muted)}
.kv{list-style:none;margin:0;padding:0;border-top:1px solid var(--rule)}
.kv li{display:flex;justify-content:space-between;gap:16px;padding-block:12px;border-bottom:1px solid var(--rule)}
.kv span{color:var(--muted)}
.kv b{font-weight:600;text-align:right}
.stepper{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 16px;border:1.5px solid var(--rule);border-radius:18px}
.stepper .ctl{display:flex;align-items:center;gap:14px}
.stepper button{all:unset;cursor:pointer;width:36px;height:36px;border-radius:50%;border:1.5px solid var(--ink);display:grid;place-items:center;font-size:20px;font-weight:600;line-height:1}
.stepper output{font-family:var(--display);font-weight:800;font-size:24px;min-width:2ch;text-align:center;font-variant-numeric:tabular-nums}
textarea{font:inherit;width:100%;min-height:84px;border:1.5px solid var(--rule);border-radius:16px;padding:12px 14px;background:var(--bg);resize:vertical;color:var(--ink)}
.field{display:flex;flex-direction:column;gap:6px}
.field label{font-size:13px;font-weight:600;color:var(--muted)}
.field input{min-width:0;width:100%;border:1.5px solid var(--rule);border-radius:14px;padding:12px 14px;background:var(--bg)}

/* Clients segment + coaching */
.seg{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;background:var(--soft);border-radius:999px;padding:4px}
.seg button{all:unset;cursor:pointer;text-align:center;padding:9px 4px;border-radius:999px;font-size:14px;font-weight:600;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--paper);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.08)}
.nudge{all:unset;cursor:pointer;display:flex;justify-content:space-between;align-items:center;gap:12px;padding:14px 18px;border-radius:18px;background:var(--soft);font-weight:600}
.tools{display:flex;gap:8px;flex-wrap:wrap}
.page{position:fixed;inset:0;z-index:15;background:var(--bg);overflow-y:auto;transform:translateX(100%);transition:transform .38s cubic-bezier(.2,.8,.2,1);padding-top:env(safe-area-inset-top,0px)}
.page.on{transform:none}
.ph{position:sticky;top:0;z-index:2;background:var(--bg);border-bottom:1px solid var(--rule);padding-left:max(8px,env(safe-area-inset-left,0px));padding-right:max(8px,env(safe-area-inset-right,0px))}
.ph .in{max-width:720px;margin:0 auto;height:60px;display:grid;grid-template-columns:44px 1fr 44px;align-items:center}
.ph .pt{display:flex;flex-direction:column;align-items:center;min-width:0;text-align:center}
.ph .pt b{font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.ph .pt span{font-size:12px;color:var(--muted)}
.pbody{max-width:720px;margin:0 auto;padding-block:24px calc(40px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:26px}
.prog{display:flex;flex-direction:column;gap:8px}
.prog-bar{display:grid;gap:4px}
.prog-bar i{height:8px;border-radius:3px;background:var(--soft)}
.prog-bar i.f{background:var(--ink)}
.prog-bar i.c{background:var(--ink);opacity:.45}
.prog .ends{display:flex;justify-content:space-between;font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.card{border:1.5px solid var(--ink);border-radius:22px;padding:18px;display:flex;flex-direction:column;gap:12px}
.card.quiet{border-style:dashed;border-color:var(--rule)}
.scales{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.scales div{display:flex;flex-direction:column;gap:6px;font-size:13px;color:var(--muted)}
.dots{display:flex;gap:4px}
.dots i{width:10px;height:10px;border-radius:50%;border:1.5px solid var(--ink)}
.dots i.f{background:var(--ink)}
.q{display:flex;flex-direction:column;gap:2px}
.q small{font-size:12px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.vlink{font-weight:600;font-size:14px;align-self:flex-start}
.day{display:flex;flex-direction:column;gap:8px}
.day-head{display:flex;justify-content:space-between;align-items:baseline;border-bottom:1px solid var(--rule);padding-bottom:8px}
.day-head h3{font-size:18px;font-weight:800;letter-spacing:-.01em}
.day-head span{font-size:13px;color:var(--muted)}
.items{display:flex;flex-direction:column;gap:6px}
.item{all:unset;box-sizing:border-box;cursor:pointer;display:flex;justify-content:space-between;align-items:center;gap:12px;padding:13px 16px;border-radius:14px;background:var(--paper);border:1px solid var(--rule);width:100%}
.item .nm{font-weight:600;min-width:0}
.item .nm small{display:block;font-weight:500;font-size:13px;color:var(--muted)}
.item .rx{font-variant-numeric:tabular-nums;color:var(--muted);white-space:nowrap;font-size:14px}
.addrow{all:unset;cursor:pointer;padding:8px 2px;font-weight:600;font-size:14px;color:var(--muted)}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.log{display:flex;flex-direction:column;gap:4px;padding-block:14px;border-bottom:1px solid var(--rule)}
.log .top{display:flex;justify-content:space-between;gap:12px}
.log .top span{font-size:13px;color:var(--muted)}
.log ul{margin:0;padding-left:18px;color:var(--muted);font-size:14px}
.log em{font-size:14px;font-style:normal}
.toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom,0px));z-index:30;transform:translate(-50%,20px);opacity:0;background:var(--ink);color:var(--bg);padding:12px 18px;border-radius:999px;font-size:14px;font-weight:600;transition:opacity .3s,transform .3s;pointer-events:none;white-space:nowrap;max-width:calc(100vw - 32px);overflow:hidden;text-overflow:ellipsis}
.toast.on{opacity:1;transform:translate(-50%,0)}

@keyframes fade{from{opacity:0;transform:translateY(8px)}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}

  // ---- Coaching (1:1 + online). Videos are links to an outside host (YouTube unlisted, Vimeo, Bunny…) ----

  const BASE={'Day A':[['swing',5,'10','24 kg'],['goblet',4,'8','20 kg'],['press',4,'5 each','16 kg'],['carry',3,'40 m each','24 kg']],

  const LOGS={
    o1:[{day:'Week 3 · Day A',when:'Tue 27 Oct',items:['Swing 5 × 10 · 24 kg','Goblet squat 4 × 8 · 20 kg','Strict press 4 × 5 · 16 kg'],note:'Press felt strong. Grip okay today.'},
        {day:'Week 2 · Day C',when:'Sat 24 Oct',items:['Snatch 6 × 5 · 16 kg','Swing 10 × 10 · 20 kg'],note:'Grip went on the last snatch set.'}],

    o3:[]
  };
  const PTC=[
    {id:'p1',name:'Erin Walsh',plan:'4 sessions a month · £130',used:2,of:4,next:'Thu 29 Oct, 7:00 am',paid:'Paid 1 Oct'},
    {id:'p2',name:'Daniel Moffat',plan:'Single sessions · from £35',used:1,of:0,next:'Tue 3 Nov, 12:00 pm',paid:'Pays on the day'}
  ];
  let seg='group';
  const exById=id=>EX.find(e=>e.id===id)||{name:id,cue:'',video:''};
  const esc=t=>String(t).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
  const host=u=>{try{return new URL(u).hostname.replace(/^www\./,'')}catch(e){return ''}};
  const toReview=()=>ONLINE.filter(o=>!o.reviewed).length;
  let view=(location.hash||'#today').slice(1);if(!['today','schedule','members','inbox'].includes(view))view='today';
  let week=0, filter='all', q='';

  // ---------- helpers ----------
  const $=s=>document.querySelector(s);
  const fmt=(d,o)=>new Intl.DateTimeFormat('en-GB',Object.assign({timeZone:'UTC'},o)).format(d);
  const key=d=>d.toISOString().slice(0,16);
  const D=k=>new Date(k+':00Z');
  const tl=d=>{const h=d.getUTCHours(),m=d.getUTCMinutes();return (h%12||12)+':'+String(m).padStart(2,'0')+' '+(h<12?'am':'pm')};
  const ini=n=>n.split(' ').map(x=>x[0]).join('').slice(0,2);
  const M=id=>MEMBERS.find(m=>m.id===id);
  const slotsFor=w=>SLOTS.map(([dd,h,m])=>{const d=new Date(WEEKS[w]+'T00:00:00Z');d.setUTCDate(d.getUTCDate()+dd);d.setUTCHours(h,m);return d});
  const allSlots=()=>WEEKS.flatMap((_,i)=>slotsFor(i));
  const nextSession=()=>allSlots().filter(d=>d.getTime()+60*60000>NOW&&!CANCELLED.has(key(d))).sort((a,b)=>a-b)[0];
  const until=d=>{const m=Math.round((d-NOW)/60000);if(m<=0&&m>-60)return 'on now';const h=Math.floor(m/60),mm=m%60;return m<60?'in '+m+' min':h<24?'in '+h+' h '+(mm?mm+' min':''):'in '+Math.round(m/1440)+' days'};
  const flags=m=>{const f=[];if(m.isNew)f.push(['new','New']);if(!m.payg&&m.credits<=2)f.push(['warn',m.credits+' credit'+(m.credits===1?'':'s')+' left']);if(m.renew==='31 Oct'||m.renew==='3 Nov')f.push(['warn','Renews '+m.renew]);if(m.payg&&!m.isNew)f.push(['','PAYG']);return f};
  const away=m=>/^(Sat 10 Oct|Mon 12 Oct)$/.test(m.last);
  const bar=(n,cap,cls)=>'<div class="'+cls+'" style="grid-template-columns:repeat('+cap+',1fr)">'+Array.from({length:cap},(_,i)=>'<i class="'+(i<n?'f':'')+'"></i>').join('')+'</div>';
  const MAP='https://www.google.com/maps/search/?api=1&query=Media%20House%2C%201A%20Dunns%20Wood%20Road%2C%20Cumbernauld%2C%20G67%203EN';
  const SITE='https://raengfitness.vercel.app/';

  // ---------- views ----------
  const views={
    today(){
      const s=nextSession(),k=key(s),ids=BOOK[k]||[],here=ids.filter(i=>attended.has(k+'|'+i)).length;
      const pay=INBOX.filter(i=>i.kind==='Payment to confirm').length, reqs=INBOX.length-pay;

      '<section class="section"><div class="section-head"><h2>Coming up</h2><button class="link" data-go="schedule">Full schedule</button></div><ul class="list">'+
        upcomingList().slice(0,3).map(([d,label,n,pt])=>'<li><div class="t"><b>'+fmt(d,{weekday:'short',day:'numeric',month:'short'})+', '+tl(d)+'</b><span>'+label+'</span></div><span style="font-variant-numeric:tabular-nums;font-weight:600">'+(pt?'1:1':n+' / '+CAP)+'</span></li>').join('')+'</ul></section>';

    schedule(){
      const tabs=WEEKS.map((w,i)=>{const d=new Date(w+'T00:00:00Z'),e=new Date(d);e.setUTCDate(e.getUTCDate()+5);const l=i===0?'This week':i===1?'Next week':fmt(d,{day:'numeric'})+'–'+fmt(e,{day:'numeric',month:'short'});return '<button class="wk" role="tab" aria-selected="'+(i===week)+'" data-week="'+i+'">'+l+'</button>'}).join('');
      const ws=new Date(WEEKS[week]+'T00:00:00Z'),we=new Date(ws);we.setUTCDate(we.getUTCDate()+7);
      const items=[...slotsFor(week).map(d=>({d,pt:false})),...PT.map(p=>({d:D(p.k),pt:true,p})).filter(x=>x.d>=ws&&x.d<we)].sort((a,b)=>a.d-b.d);
      const total=slotsFor(week).reduce((a,d)=>a+(BOOK[key(d)]||[]).length,0);
      return '<div class="head"><p class="eyebrow">Schedule</p><h1>'+total+' bookings this week.</h1><p class="muted">'+CAP+' spaces per class. Tap a session to see who\'s coming.</p></div>'+

        '<button class="btn" data-act="addpt" style="flex:none">Add a 1:1 session</button>';

      if(seg==='online'){
        return '<div class="head"><p class="eyebrow">Clients</p><h1>'+ONLINE.length+' online clients.</h1><p class="muted">£79 a month. Programmes, check-ins and logs.</p></div>'+segBar+

  function libraryPage(){return ()=>({title:'Exercise library',sub:EX.length+' exercises',body:
    '<div class="head"><p class="eyebrow">Exercise library</p><h1>Your movements.</h1><p class="muted">Each exercise links to a demo video hosted elsewhere, such as an unlisted YouTube or Vimeo video. Clients see the link in their workout.</p></div>'+
    '<div style="border-top:1px solid var(--rule)">'+EX.map(e=>'<button class="rowbtn" data-ex="'+e.id+'" style="grid-template-columns:1fr auto"><span class="who"><b>'+esc(e.name)+'</b><span>'+esc(e.cue)+'</span></span><span class="r">'+(e.video?'<span class="tag ok">Video</span>':'<span class="tag warn">No video</span>')+'</span></button>').join('')+'</div>'+
    '<button class="btn" data-newex style="flex:none">Add an exercise</button>'})}
  function exSheet(id){
    const e=id?EX.find(x=>x.id===id):{id:'',name:'',cue:'',video:''};
    openSheet('<p class="eyebrow">'+(id?'Edit exercise':'New exercise')+'</p><h3 id="sheetTitle">'+(id?esc(e.name):'Add an exercise')+'</h3>'+
      (id?'':'<div class="field"><label for="eName">Name</label><input id="eName" placeholder="e.g. Double kettlebell front squat"></div>')+
      '<div class="field"><label for="eCue">Coaching cue</label><input id="eCue" value="'+esc(e.cue)+'"></div>'+
      '<div class="field"><label for="eVid">Demo video link</label><input id="eVid" type="url" inputmode="url" value="'+esc(e.video)+'" placeholder="https://youtu.be/… or https://vimeo.com/…"></div>'+
      '<p class="muted" id="eErr" style="font-size:14px">Paste a link from YouTube (unlisted), Vimeo, Bunny Stream or Google Drive.</p>'+
      '<div class="btns"><button class="btn quiet" data-close>Cancel</button><button class="btn solid" id="eSave">Save</button></div>');
    $('#eSave').addEventListener('click',()=>{
      const v=$('#eVid').value.trim();
      if(v&&!/^https?:$/.test((()=>{try{return new URL(v).protocol}catch(x){return ''}})())){$('#eErr').textContent='That link doesn\'t look right. It should start with https://';$('#eErr').style.color='var(--warn)';return}
      if(!id){const n=$('#eName').value.trim();if(!n){$('#eName').focus();return}EX.push({id:'x'+Date.now(),name:n,cue:$('#eCue').value.trim(),video:v})}
      else{e.cue=$('#eCue').value.trim();e.video=v}
      closeSheet();drawPage();toast(v?'Saved with video link':'Saved')});
  }
  function tplSheet(){
    openSheet('<p class="eyebrow">Templates</p><h3 id="sheetTitle">Start from a template</h3><div style="border-top:1px solid var(--rule)">'+TEMPLATES.map(t=>'<button class="rowbtn" data-builder="'+t.id+'" style="grid-template-columns:1fr auto"><span class="who"><b>'+esc(t.name)+'</b><span>6 weeks · 3 days a week</span></span><span class="pill-btn">Open</span></button>').join('')+'</div>');
  }
  function ptcSheet(id){
    const c=PTC.find(x=>x.id===id);
    openSheet('<p class="eyebrow">1:1 client</p><h3 id="sheetTitle">'+esc(c.name)+'</h3><ul class="kv"><li><span>Plan</span><b>'+c.plan+'</b></li>'+(c.of?'<li><span>This month</span><b>'+c.used+' of '+c.of+' sessions used</b></li>':'')+'<li><span>Next session</span><b>'+c.next+'</b></li><li><span>Payment</span><b>'+c.paid+'</b></li></ul>'+
      '<div class="field"><label for="pnote">Coach notes</label><textarea id="pnote" placeholder="Goals, injuries, weights used…"></textarea></div>'+
      '<div class="btns"><button class="btn" data-close>Close</button><button class="btn solid" data-act="addpt">Book next session</button></div>');
  }

  document.addEventListener('click',e=>{
    const t=e.target.closest('[data-seg],[data-seg-go],[data-oc],[data-builder],[data-lib],[data-tpls],[data-ex],[data-newex],[data-item],[data-additem],[data-pick],[data-bweek],[data-copyweek],[data-savetpl],[data-review],[data-nudge],[data-msgc],[data-ptc],[data-back]');if(!t)return;
    const d=t.dataset;
    if(d.seg){seg=d.seg;render()}
    else if(d.segGo){seg=d.segGo;go('members')}
    else if(d.oc)showPage(clientPage(d.oc));
    else if(d.builder){closeSheet();showPage(builderPage(d.builder))}
    else if(d.lib!==undefined)showPage(libraryPage());
    else if(d.tpls!==undefined)tplSheet();
    else if(d.ex)exSheet(d.ex);
    else if(d.newex!==undefined)exSheet('');
    else if(d.item){const [o,di,ii]=d.item.split('|');itemSheet(o,+di,+ii)}
    else if(d.additem){const [o,di]=d.additem.split('|');pickSheet(o,+di)}
    else if(d.pick){const [o,di,ex]=d.pick.split('|');const items=progOf(o)[bWeek].days[+di].items;items.push({ex,sets:3,reps:'8',load:'',note:''});closeSheet();drawPage();itemSheet(o,+di,items.length-1)}
    else if(d.bweek){bWeek=+d.bweek;drawPage()}
    else if(d.copyweek){const p=progOf(d.copyweek);p[bWeek+1]=JSON.parse(JSON.stringify(p[bWeek]));bWeek++;drawPage();toast('Copied to week '+(bWeek+1))}
    else if(d.savetpl){const o=ONLINE.find(x=>x.id===d.savetpl);TEMPLATES.push({id:'t'+Date.now(),name:o.block+' (from '+o.name.split(' ')[0]+')',prog:JSON.parse(JSON.stringify(PROGS[o.id]))});toast('Saved as a template')}
    else if(d.review){const o=ONLINE.find(x=>x.id===d.review);o.reviewed=true;drawPage();toast('Reply sent to '+o.name.split(' ')[0]+' (example)')}
    else if(d.nudge){const o=ONLINE.find(x=>x.id===d.nudge);toast('Nudge sent to '+o.name.split(' ')[0]+' (example)')}
    else if(d.msgc){const o=ONLINE.find(x=>x.id===d.msgc);openSheet('<p class="eyebrow">Message</p><h3 id="sheetTitle">'+esc(o.name)+'</h3><div class="field"><label for="mc">Message</label><textarea id="mc"></textarea></div><div class="btns"><button class="btn quiet" data-close>Cancel</button><button class="btn solid" data-close id="mcs">Send</button></div>');$('#mcs').addEventListener('click',()=>toast('Sent (example)'))}
    else if(d.ptc)ptcSheet(d.ptc);
    else if(d.back!==undefined)back();
  });
  document.addEventListener('keydown',e=>{if(e.key==='Escape'&&page.classList.contains('on')&&!sheet.classList.contains('on'))back()},true);

  // ---------- toast ----------
  let tt;function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('on');clearTimeout(tt);tt=setTimeout(()=>t.classList.remove('on'),2400)}

  // ---------- events ----------
  document.addEventListener('click',e=>{
    const t=e.target.closest('[data-view],[data-go],[data-check],[data-member],[data-session],[data-week],[data-filter],[data-filter-go],[data-inbox],[data-act],[data-close],[data-pt]');if(!t)return;
    if(t.dataset.close!==undefined){closeSheet();return}
    if(t.dataset.view)go(t.dataset.view);
    else if(t.dataset.go)go(t.dataset.go);
    else if(t.dataset.check){const on=attended.has(t.dataset.check);on?attended.delete(t.dataset.check):attended.add(t.dataset.check);render();if(!on){const m=M(t.dataset.check.split('|')[1]);toast(m.name.split(' ')[0]+' checked in')}}
    else if(t.dataset.member){closeDrawer();memberSheet(t.dataset.member)}
    else if(t.dataset.session)sessionSheet(t.dataset.session);
    else if(t.dataset.pt){const p=PT.find(x=>x.k===t.dataset.pt);openSheet('<p class="eyebrow">1:1 session</p><h3 id="sheetTitle">'+p.who+'</h3><p class="muted">'+fmt(D(p.k),{weekday:'long',day:'numeric',month:'long'})+', '+tl(D(p.k))+' · Media House</p><div class="btns"><button class="btn quiet" data-close>Close</button><button class="btn" data-close>Reschedule</button></div>')}
    else if(t.dataset.week){week=+t.dataset.week;render()}
    else if(t.dataset.filter){filter=t.dataset.filter;render()}
    else if(t.dataset.filterGo){filter=t.dataset.filterGo;seg='group';go('members')}
    else if(t.dataset.inbox){const it=INBOX.find(i=>i.id===t.dataset.inbox),a=t.dataset.a;
      if(a==='Remind'){toast('Reminder sent to '+it.who.split(' ')[0]+' (example)');return}
      INBOX=INBOX.filter(i=>i!==it);render();toast(a==='Mark paid'?'Marked paid: '+it.who:a==='Reply'?'Reply sent to '+it.who.split(' ')[0]+' (example)':'Closed: '+it.who)}
    else if(t.dataset.act){closeDrawer();const k=t.dataset.k;if(t.dataset.act==='walkin')walkinSheet(k);else if(t.dataset.act==='msg')msgSheet(k);else if(t.dataset.act==='addpt')ptSheet()}
  });
  addEventListener('hashchange',()=>{const v=location.hash.slice(1);if(views[v]&&v!==view){view=v;render()}});
  render();
})();
</script>
