<title>Raeng Members Area</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;800&display=swap">
<style>
/* Layout: app-like members area; slim header with avatar, three views (Home / Book / Plan) switched by a bottom tab bar; one ink card per view carries the weight, everything else on hairlines */
:root{
  color-scheme:light;
  --bg:#faf6ee; --ink:#151515; --rule:#cfcbc2; --muted:#5d5a54; --soft:#e8e4db; --paper:#ffffff;
  --display:"Archivo","Helvetica Neue",Arial,sans-serif;
  --body:"Archivo","Helvetica Neue",Arial,sans-serif;
}
/* Single light look to match the Raeng site in every theme */
:root{color-scheme:light}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.5}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
button{font:inherit;color:inherit}
p,h1,h2,h3{margin:0}
.muted{color:var(--muted)}
.gut{padding-left:max(20px,env(safe-area-inset-left,0px));padding-right:max(20px,env(safe-area-inset-right,0px))}
:focus-visible{outline:2px solid var(--ink);outline-offset:3px}

/* Header */
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);border-bottom:1px solid var(--rule)}
.bar{max-width:620px;margin:0 auto;height:60px;display:grid;grid-template-columns:44px 1fr 44px;align-items:center}
.icon-btn{all:unset;cursor:pointer;width:44px;height:44px;display:grid;place-items:center;border-radius:50%}
.icon-btn svg{width:22px;height:22px;stroke:var(--ink);fill:none;stroke-width:1.8;stroke-linecap:round}
.mark{text-align:center;font-weight:800;letter-spacing:.34em;font-size:17px;padding-left:.34em}
.mark small{display:block;font-size:9px;font-weight:600;letter-spacing:.4em;color:var(--muted);margin-top:-2px}
.avatar{all:unset;cursor:pointer;justify-self:end;width:36px;height:36px;border-radius:50%;background:var(--ink);color:var(--bg);display:grid;place-items:center;font-weight:700;font-size:15px}

/* Views */
main{max-width:620px;margin:0 auto;padding-top:28px;padding-bottom:calc(110px + env(safe-area-inset-bottom,0px))}
.view{display:flex;flex-direction:column;gap:28px;animation:fade .35s both}
.eyebrow{font-size:12px;font-weight:600;letter-spacing:.3em;text-transform:uppercase;color:var(--muted)}
h1{font-family:var(--display);font-weight:800;font-size:clamp(30px,8.4vw,42px);letter-spacing:-.035em;line-height:1.05;text-wrap:balance}
h2{font-size:13px;font-weight:600;letter-spacing:.24em;text-transform:uppercase;color:var(--muted)}
.head{display:flex;flex-direction:column;gap:8px}
.demo{display:inline-flex;align-self:flex-start;font-size:11px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;padding:4px 10px;border-radius:999px;border:1px dashed var(--rule);color:var(--muted)}

/* Next class card */
.next{background:var(--ink);color:var(--bg);border-radius:24px;padding:22px 22px 18px;display:flex;flex-direction:column;gap:14px}
.next .lbl{font-size:12px;font-weight:600;letter-spacing:.24em;text-transform:uppercase;opacity:.7}
.next .when{font-family:var(--display);font-weight:800;font-size:clamp(26px,7.4vw,34px);letter-spacing:-.03em;line-height:1.08}
.next .where{opacity:.75;font-size:15px}
.next .row{display:flex;justify-content:space-between;align-items:center;gap:12px;border-top:1px solid color-mix(in srgb,var(--bg) 22%,transparent);padding-top:14px;flex-wrap:wrap}
.count{font-variant-numeric:tabular-nums;font-weight:600}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{all:unset;cursor:pointer;font-size:14px;font-weight:600;padding:8px 14px;border-radius:999px;border:1px solid color-mix(in srgb,var(--bg) 40%,transparent)}
.chip:hover{background:var(--bg);color:var(--ink)}
.empty-next{border:1.5px dashed var(--rule);border-radius:24px;padding:24px;display:flex;flex-direction:column;gap:12px;align-items:flex-start}

/* Credits */
.credits{display:grid;grid-template-columns:96px 1fr;gap:20px;align-items:center;padding-block:4px}
.ring{width:96px;height:96px}
.ring .track{fill:none;stroke:var(--soft);stroke-width:8}
.ring .fill{fill:none;stroke:var(--ink);stroke-width:8;stroke-linecap:round;transform:rotate(-90deg);transform-origin:50% 50%;transition:stroke-dashoffset .7s cubic-bezier(.2,.8,.2,1)}
.ring text{fill:var(--ink);font-family:"Archivo",Arial,sans-serif;font-weight:800;font-size:28px;font-variant-numeric:tabular-nums}
.ring .of{font-size:11px;font-weight:600;fill:var(--muted);letter-spacing:1px}
.credits div{display:flex;flex-direction:column;gap:2px;min-width:0}
.credits b{font-size:18px;letter-spacing:-.01em}
.credits .small{font-size:14px}

/* Lists */
.list{list-style:none;margin:0;padding:0;border-top:1px solid var(--rule)}
.list li{display:flex;justify-content:space-between;align-items:center;gap:12px;padding-block:16px;border-bottom:1px solid var(--rule);min-width:0}
.list .t{display:flex;flex-direction:column;min-width:0}
.list .t b{font-weight:600}
.list .t span{font-size:14px;color:var(--muted)}
.link{all:unset;cursor:pointer;font-weight:600;font-size:15px;border-bottom:1.5px solid var(--ink)}
.empty{color:var(--muted);padding-block:16px;border-bottom:1px solid var(--rule)}
.section{display:flex;flex-direction:column;gap:12px}
.section-head{display:flex;justify-content:space-between;align-items:baseline}

/* Book view */
.weeks{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;margin-inline:-4px;padding:4px}
.weeks::-webkit-scrollbar{display:none}
.wk{all:unset;cursor:pointer;flex:none;padding:10px 16px;border-radius:999px;border:1.5px solid var(--rule);font-size:14px;font-weight:600;white-space:nowrap;transition:background .25s,color .25s,border-color .25s}
.wk[aria-selected="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.slots{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.slot{all:unset;cursor:pointer;position:relative;display:flex;flex-direction:column;align-items:center;gap:2px;padding:18px 6px 14px;border:1.5px solid var(--ink);border-radius:20px;text-align:center;min-width:0;transition:transform .15s,background .25s,color .25s}
.slot:active{transform:scale(.97)}
.slot .d{font-size:12px;font-weight:600;letter-spacing:.2em}
.slot .n{font-family:var(--display);font-weight:800;font-size:clamp(26px,7.6vw,34px);letter-spacing:-.03em;line-height:1.1;font-variant-numeric:tabular-nums}
.slot .tm{font-size:14px}
.slot .st{margin-top:8px;font-size:11px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;padding:3px 9px;border-radius:999px;border:1px solid currentColor;white-space:nowrap}
.slot.booked{background:var(--ink);color:var(--bg)}
.slot.past{border-color:var(--rule);color:var(--muted);cursor:default;border-style:dashed}
.slot.past:active{transform:none}
.slot.out{border-color:var(--rule);color:var(--muted)}
.hint{font-size:14px;color:var(--muted)}

/* Plan view */
.plan-card{border:1.5px solid var(--ink);border-radius:24px;padding:22px;display:flex;flex-direction:column;gap:6px}
.plan-card .nm{font-family:var(--display);font-weight:800;font-size:28px;letter-spacing:-.03em}
.period{display:flex;flex-direction:column;gap:8px;margin-top:12px}
.track-bar{height:6px;border-radius:99px;background:var(--soft);overflow:hidden}
.track-bar i{display:block;height:100%;background:var(--ink);border-radius:99px}
.period .ends{display:flex;justify-content:space-between;font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.kv{list-style:none;margin:0;padding:0;border-top:1px solid var(--rule)}
.kv li{display:flex;justify-content:space-between;gap:16px;padding-block:14px;border-bottom:1px solid var(--rule)}
.kv span{color:var(--muted)}
.kv b{font-weight:600;text-align:right;min-width:0;overflow-wrap:anywhere}

/* Tab bar */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:6;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-top:1px solid var(--rule);padding-bottom:env(safe-area-inset-bottom,0px)}
.tabs .in{max-width:620px;margin:0 auto;display:grid;grid-template-columns:repeat(3,1fr);position:relative}
.tab{all:unset;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:3px;padding:10px 0 12px;font-size:12px;font-weight:600;color:var(--muted);transition:color .25s}
.tab svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.tab[aria-selected="true"]{color:var(--ink)}
.tab-ind{position:absolute;top:-1px;left:0;width:calc(100% / 3);height:2px;display:flex;justify-content:center;transition:transform .45s cubic-bezier(.3,1.3,.5,1)}
.tab-ind::after{content:"";width:28px;height:2px;background:var(--ink);border-radius:2px}

/* Drawer (members menu) */
.scrim{position:fixed;inset:0;z-index:20;background:rgba(10,10,10,.38);opacity:0;pointer-events:none;transition:opacity .3s}
.scrim.on{opacity:1;pointer-events:auto}
.drawer{position:fixed;top:0;bottom:0;left:0;z-index:21;width:min(340px,86vw);background:var(--bg);transform:translateX(-102%);transition:transform .4s cubic-bezier(.2,.8,.2,1);display:flex;flex-direction:column;padding:calc(18px + env(safe-area-inset-top,0px)) 22px calc(22px + env(safe-area-inset-bottom,0px)) max(22px,env(safe-area-inset-left,0px));overflow-y:auto}
.drawer.on{transform:none}
.who{display:flex;gap:14px;align-items:center;padding-bottom:18px;border-bottom:1px solid var(--rule)}
.who .avatar{width:46px;height:46px;font-size:18px;cursor:default}
.who div{display:flex;flex-direction:column;min-width:0}
.who b{font-size:17px}
.who span{font-size:14px;color:var(--muted)}
.mnav{display:flex;flex-direction:column;padding-block:12px}
.mnav button{all:unset;cursor:pointer;display:flex;justify-content:space-between;align-items:center;padding:12px 0;font-size:22px;font-weight:800;letter-spacing:-.02em}
.mnav button span{font-size:13px;font-weight:600;color:var(--muted);letter-spacing:0}
.mnav button[aria-current="page"]::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--ink);margin-right:10px}
.mnav button[aria-current="page"]{justify-content:flex-start}
.mnav button[aria-current="page"] span{margin-left:auto}
details{border-top:1px solid var(--rule);padding-block:6px}
summary{cursor:pointer;list-style:none;display:flex;justify-content:space-between;padding:12px 0;font-size:12px;font-weight:600;letter-spacing:.28em;text-transform:uppercase;color:var(--muted)}
summary::-webkit-details-marker{display:none}
summary::after{content:"+";font-size:18px;letter-spacing:0;line-height:1}
details[open] summary::after{content:"−"}
.site{display:flex;flex-direction:column;gap:2px;padding-bottom:8px}
.site a{color:var(--ink);text-decoration:none;padding:7px 0;font-size:16px}
/* Drawer layout switcher (demo only) */
.dlayout{margin-top:auto;padding-top:18px;border-top:1px dashed var(--rule);display:flex;flex-direction:column;gap:8px}
.dlayout p{font-size:11px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.dlayout .seg{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;background:var(--soft);border-radius:999px;padding:4px}
.dlayout button{all:unset;cursor:pointer;text-align:center;padding:8px 4px;border-radius:999px;font-size:13px;font-weight:600;color:var(--muted)}
.dlayout button[aria-pressed="true"]{background:var(--paper);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.08)}
#dbody{display:flex;flex-direction:column;flex:1}
/* B: grouped */
.grp{display:flex;flex-direction:column;padding-block:14px;border-bottom:1px solid var(--rule)}
.grp h4{margin:0 0 6px;font-size:11px;font-weight:600;letter-spacing:.28em;text-transform:uppercase;color:var(--muted)}
.grp button,.grp a{all:unset;cursor:pointer;display:flex;justify-content:space-between;padding:8px 0;font-size:17px;font-weight:600;color:var(--ink)}
.grp button span,.grp a span{font-size:13px;color:var(--muted);font-weight:500}
/* C: action-first */
.mini{margin-top:16px;background:var(--ink);color:var(--bg);border-radius:20px;padding:16px 18px;display:flex;flex-direction:column;gap:2px}
button.mini{border:0;font:inherit;text-align:left;cursor:pointer;width:100%}
.mini small{font-size:11px;font-weight:600;letter-spacing:.2em;text-transform:uppercase;opacity:.7}
.mini b{font-size:18px;letter-spacing:-.01em}
.mini span{font-size:13px;opacity:.75}
.bigbook{all:unset;cursor:pointer;margin-top:12px;text-align:center;padding:15px;border-radius:999px;border:1.5px solid var(--ink);font-weight:700}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px;margin-bottom:24px}
.tile{all:unset;cursor:pointer;display:flex;flex-direction:column;gap:10px;padding:14px;border-radius:18px;background:var(--soft);font-size:14px;font-weight:600;color:var(--ink)}
.tile svg{width:22px;height:22px;fill:none;stroke:var(--ink);stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.foot-links{display:flex;flex-wrap:wrap;gap:6px 14px;margin-top:auto;padding-top:18px;border-top:1px solid var(--rule);font-size:14px}
.foot-links a{color:var(--muted);text-decoration:none}

/* Account menu (top right) */
.acct{position:fixed;z-index:22;width:min(300px,calc(100vw - 24px));background:var(--paper);border:1px solid var(--rule);border-radius:20px;box-shadow:0 18px 40px -12px rgba(20,18,14,.25);padding:8px;opacity:0;transform:translateY(-6px) scale(.97);transform-origin:top right;pointer-events:none;transition:opacity .2s,transform .25s cubic-bezier(.2,.8,.2,1)}
.acct.on{opacity:1;transform:none;pointer-events:auto}
.acct-head{display:flex;gap:12px;align-items:center;padding:10px 10px 14px;border-bottom:1px solid var(--rule);margin-bottom:6px}
.acct-head .avatar{width:40px;height:40px;cursor:default}
.acct-head div{display:flex;flex-direction:column;min-width:0}
.acct-head b{font-size:16px}
.acct-head span{font-size:13px;color:var(--muted)}
.acct [role="menuitem"]{all:unset;box-sizing:border-box;cursor:pointer;width:100%;display:flex;align-items:center;gap:12px;padding:11px 10px;border-radius:12px;font-size:15px;font-weight:500;color:var(--ink)}
.acct [role="menuitem"]:hover,.acct [role="menuitem"]:focus-visible{background:var(--soft);outline:none}
.acct [role="menuitem"] svg{width:19px;height:19px;flex:none;fill:none;stroke:var(--ink);stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.acct [role="menuitem"] em{margin-left:auto;font-style:normal;font-size:12px;color:var(--muted)}
.acct hr{border:0;border-top:1px solid var(--rule);margin:6px 0}
.acct .out{color:var(--muted)}
.acct .out svg{stroke:var(--muted)}
.who .avatar,.acct-head .avatar{color:var(--bg);font-size:17px}
.avatar[aria-expanded="true"]{box-shadow:0 0 0 3px var(--bg),0 0 0 4.5px var(--ink)}

/* Bottom sheet */
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:21;background:var(--paper);border-radius:26px 26px 0 0;transform:translateY(105%);transition:transform .4s cubic-bezier(.2,.8,.2,1);padding:12px max(22px,env(safe-area-inset-right,0px)) calc(22px + env(safe-area-inset-bottom,0px)) max(22px,env(safe-area-inset-left,0px))}
.sheet.on{transform:none}
.sheet .in{max-width:576px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
.grab{width:40px;height:4px;border-radius:4px;background:var(--rule);align-self:center;margin-bottom:6px}
.sheet h3{font-family:var(--display);font-weight:800;font-size:26px;letter-spacing:-.03em;line-height:1.1}
.sheet .btns{display:flex;gap:10px;margin-top:6px}
.btn{all:unset;cursor:pointer;flex:1;text-align:center;padding:15px 20px;border-radius:999px;font-weight:600;border:1.5px solid var(--ink)}
.btn.solid{background:var(--ink);color:var(--bg)}

/* Toast */
.toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom,0px));z-index:30;transform:translate(-50%,20px);opacity:0;background:var(--ink);color:var(--bg);padding:12px 18px;border-radius:999px;font-size:14px;font-weight:600;transition:opacity .3s,transform .3s;pointer-events:none;white-space:nowrap;max-width:calc(100vw - 32px);overflow:hidden;text-overflow:ellipsis}
.toast.on{opacity:1;transform:translate(-50%,0)}

@keyframes fade{from{opacity:0;transform:translateY(8px)}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
</style>

<header>
  <div class="bar gut">
    <button class="icon-btn" id="menuBtn" aria-label="Open members menu" aria-expanded="false" aria-controls="drawer">
      <svg viewBox="0 0 24 24"><path d="M4 8h16M4 16h11"/></svg>
    </button>
    <div class="mark" aria-label="Raeng Fitness">RAENG<small>MEMBERS</small></div>
    <button class="avatar" id="avatarBtn" aria-label="Account menu" aria-haspopup="menu" aria-expanded="false" aria-controls="acct">N</button>
  </div>
</header>

<main class="gut" id="main"></main>

<nav class="tabs" aria-label="Members">
  <div class="in" role="tablist">
    <span class="tab-ind" id="tabInd" aria-hidden="true"></span>
    <button class="tab" role="tab" data-view="home" aria-selected="true"><svg viewBox="0 0 24 24"><path d="M4 11 12 4l8 7v9h-5v-6H9v6H4z"/></svg>Home</button>
    <button class="tab" role="tab" data-view="book" aria-selected="false"><svg viewBox="0 0 24 24"><rect x="4" y="5" width="16" height="15" rx="3"/><path d="M4 10h16M9 3v4M15 3v4M10 15l1.5 1.5L15 13"/></svg>Book</button>
    <button class="tab" role="tab" data-view="plan" aria-selected="false"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8"/><path d="M12 4a8 8 0 0 1 8 8h-8z"/></svg>Plan</button>
  </div>
</nav>

<div class="scrim" id="scrim"></div>

<aside class="drawer" id="drawer" aria-label="Members menu" aria-hidden="true">
  <div id="dbody"></div>
</aside>

<div class="acct" id="acct" role="menu" aria-label="Account" aria-hidden="true">
  <div class="acct-head"><span class="avatar" aria-hidden="true">N</span><div><b>Nitisat</b><span id="acctSub">Dedicated member</span></div></div>
  <button role="menuitem" data-acct="profile"><svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 20c1.5-4 4.5-6 8-6s6.5 2 8 6"/></svg>Profile and details</button>
  <button role="menuitem" data-acct="plan"><svg viewBox="0 0 24 24"><rect x="3" y="6" width="18" height="13" rx="2.5"/><path d="M3 10h18M7 15h4"/></svg>Plan and billing<em>£85 / 4 wks</em></button>
  <button role="menuitem" data-acct="notify"><svg viewBox="0 0 24 24"><path d="M6 16V11a6 6 0 0 1 12 0v5l1.5 2h-15z"/><path d="M10 20a2 2 0 0 0 4 0"/></svg>Notifications<em>On</em></button>
  <button role="menuitem" data-acct="cal"><svg viewBox="0 0 24 24"><rect x="4" y="5" width="16" height="15" rx="3"/><path d="M4 10h16M9 3v4M15 3v4"/></svg>Calendar sync<em>Not connected</em></button>
  <button role="menuitem" data-acct="security"><svg viewBox="0 0 24 24"><rect x="5" y="10" width="14" height="10" rx="2.5"/><path d="M8 10V7a4 4 0 0 1 8 0v3"/></svg>Sign-in and security</button>
  <hr>
  <button role="menuitem" data-acct="help"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.5"/><path d="M9.6 9.5a2.5 2.5 0 1 1 3.4 2.3c-.6.3-1 .8-1 1.5v.4M12 16.8v.1"/></svg>Help and contact</button>
  <button role="menuitem" class="out" data-acct="out"><svg viewBox="0 0 24 24"><path d="M14 4h4a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2h-4M10 16l-4-4 4-4M6 12h10"/></svg>Sign out</button>
</div>

<div class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="sheetTitle" aria-hidden="true">
  <div class="in">
    <span class="grab" aria-hidden="true"></span>
    <p class="eyebrow" id="sheetEyebrow">Book with a credit</p>
    <h3 id="sheetTitle">Saturday 31 October, 9:00 am</h3>
    <p class="muted" id="sheetBody">Uses 1 of your 10 credits. Kettlebell training at Media House, Cumbernauld.</p>
    <div class="btns"><button class="btn" id="sheetNo">Not now</button><button class="btn solid" id="sheetYes">Book it</button></div>
  </div>
</div>

<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
(function(){
  // ---- Example data, shaped like the current members area. Replace with your Supabase data. ----
  const NOW=new Date('2026-10-28T18:50:00Z');            // 28 Oct 2026, 6:50 pm UK
  const PERIOD={start:new Date('2026-10-27T00:00:00Z'),end:new Date('2026-11-23T23:59:00Z'),renew:'Tuesday 24 November'};
  const PLAN={name:'Dedicated',price:'£85',every:'4 weeks',credits:12};
  const ME={name:'Nitisat'};
  const SLOTS=[[0,18,30],[2,18,30],[5,9,0]];              // Mon 6:30 pm, Wed 6:30 pm, Sat 9:00 am
  const WEEKS=['2026-10-26','2026-11-02','2026-11-09','2026-11-16','2026-11-23'];
  let booked=new Set(['2026-10-28T18:30','2026-11-04T18:30']); // one attended, one upcoming
  let view=(location.hash||'#home').slice(1); if(!['home','book','plan'].includes(view))view='home';
  let week=0;

  const $=s=>document.querySelector(s);
  const main=$('#main');
  const fmt=(d,o)=>new Intl.DateTimeFormat('en-GB',Object.assign({timeZone:'UTC'},o)).format(d);
  const key=d=>d.toISOString().slice(0,16);
  const timeLbl=d=>{const h=d.getUTCHours(),m=d.getUTCMinutes();return (h%12||12)+':'+String(m).padStart(2,'0')+' '+(h<12?'am':'pm')};
  const longLbl=d=>fmt(d,{weekday:'long',day:'numeric',month:'long'})+', '+timeLbl(d);
  const slotsFor=w=>SLOTS.map(([dd,h,m])=>{const d=new Date(WEEKS[w]+'T00:00:00Z');d.setUTCDate(d.getUTCDate()+dd);d.setUTCHours(h,m);return d});
  const all=()=>WEEKS.flatMap((_,i)=>slotsFor(i));
  const used=()=>[...booked].filter(k=>{const d=new Date(k+':00Z');return d>=PERIOD.start&&d<=PERIOD.end}).length;
  const left=()=>PLAN.credits-used();
  const upcoming=()=>all().filter(d=>booked.has(key(d))&&d>NOW).sort((a,b)=>a-b);
  const until=d=>{const m=Math.round((d-NOW)/60000),dd=Math.floor(m/1440),h=Math.floor(m%1440/60);return dd>1?'in '+dd+' days':dd===1?'tomorrow':h>0?'in '+h+' h':'in '+m+' min'};

  function ring(n,of){
    const c=2*Math.PI*40,off=c*(1-n/of);
    return '<svg class="ring" viewBox="0 0 96 96" role="img" aria-label="'+n+' of '+of+' credits left"><circle class="track" cx="48" cy="48" r="40"/><circle class="fill" cx="48" cy="48" r="40" stroke-dasharray="'+c.toFixed(1)+'" stroke-dashoffset="'+off.toFixed(1)+'"/><text x="48" y="54" text-anchor="middle">'+n+'</text><text class="of" x="48" y="70" text-anchor="middle">OF '+of+'</text></svg>';
  }

  const views={
    home(){
      const up=upcoming(),nx=up[0];
      return '<div class="head"><span class="demo">Example data</span><p class="eyebrow">Members</p><h1>Evening, '+ME.name+'.</h1></div>'+
      (nx?'<section class="next" aria-label="Your next class"><p class="lbl">Your next class</p><p class="when">'+fmt(nx,{weekday:'long',day:'numeric',month:'long'})+'<br>'+timeLbl(nx)+'</p><p class="where">Kettlebell training · Media House, Cumbernauld</p><div class="row"><span class="count">'+until(nx)+'</span><div class="chips"><button class="chip" data-act="cal">Add to calendar</button><a class="chip" href="https://www.google.com/maps/search/?api=1&query=Media%20House%2C%201A%20Dunns%20Wood%20Road%2C%20Cumbernauld%2C%20G67%203EN" target="_blank" rel="noopener">Directions</a></div></div></section>'
        :'<section class="empty-next"><p class="lbl eyebrow">No class booked</p><p>You have '+left()+' credits to use before '+fmt(PERIOD.end,{day:'numeric',month:'long'})+'.</p><button class="btn solid" data-go="book" style="flex:none">Book a class</button></section>')+
      '<section class="credits" aria-label="Credits">'+ring(left(),PLAN.credits)+'<div><b>'+left()+' credits left</b><span class="muted small">'+PLAN.name+' · renews '+PERIOD.renew.split(' ').slice(1).join(' ')+'</span><span class="muted small">Unused credits don\'t roll over.</span></div></section>'+
      '<section class="section"><div class="section-head"><h2>Booked</h2><button class="link" data-go="book">Book more</button></div>'+
      (up.length?'<ul class="list">'+up.map(d=>'<li><div class="t"><b>'+longLbl(d)+'</b><span>Membership credit</span></div><button class="link" data-cancel="'+key(d)+'">Cancel</button></li>').join('')+'</ul>':'<p class="empty">Nothing booked yet.</p>')+'</section>';
    },
    book(){
      const tabs=WEEKS.map((w,i)=>{const d=new Date(w+'T00:00:00Z');const lbl=i===0?'This week':i===1?'Next week':(()=>{const e=new Date(d);e.setUTCDate(e.getUTCDate()+5);return fmt(d,{day:'numeric'})+'–'+fmt(e,{day:'numeric',month:'short'})})();return '<button class="wk" role="tab" aria-selected="'+(i===week)+'" data-week="'+i+'">'+lbl+'</button>'}).join('');
      const cards=slotsFor(week).map(d=>{
        const k=key(d),b=booked.has(k),past=d<=NOW,out=d>PERIOD.end;
        const cls='slot'+(b?' booked':'')+(past?' past':'')+(out&&!b?' out':'');
        const st=past?(b?'Attended':'Past'):b?'Booked':out?'Next period':left()>0?'Book':'No credits';
        return '<button class="'+cls+'" data-slot="'+k+'"'+(past?' aria-disabled="true"':'')+'><span class="d">'+fmt(d,{weekday:'short'}).toUpperCase()+'</span><span class="n">'+fmt(d,{day:'numeric'})+'</span><span class="tm">'+timeLbl(d)+'</span><span class="st">'+st+'</span></button>';
      }).join('');
      return '<div class="head"><p class="eyebrow">Book a class</p><h1>'+left()+' credits to use.</h1><p class="muted">Before '+fmt(PERIOD.end,{weekday:'long',day:'numeric',month:'long'})+'. One credit per class.</p></div>'+
      '<div class="weeks" role="tablist" aria-label="Week">'+tabs+'</div><div class="slots">'+cards+'</div><p class="hint">Tap a class to book it. Tap a booked class to cancel.</p>';
    },
    plan(){
      const total=PERIOD.end-PERIOD.start,pct=Math.min(100,Math.max(0,(NOW-PERIOD.start)/total*100));
      return '<div class="head"><p class="eyebrow">Plan and account</p><h1>Your membership.</h1></div>'+
      '<section class="plan-card"><span class="eyebrow">Current plan</span><span class="nm">'+PLAN.name+'</span><span class="muted">'+PLAN.price+' every '+PLAN.every+' · '+PLAN.credits+' credits</span>'+
      '<div class="period"><div class="track-bar"><i style="width:'+pct.toFixed(1)+'%"></i></div><div class="ends"><span>'+fmt(PERIOD.start,{day:'numeric',month:'short'})+'</span><span>Renews '+fmt(new Date(PERIOD.end.getTime()+60000),{day:'numeric',month:'short'})+'</span></div></div></section>'+
      '<ul class="kv"><li><span>Credits used</span><b>'+used()+' of '+PLAN.credits+'</b></li><li><span>Next renewal</span><b>'+PERIOD.renew+'</b></li><li><span>New credits</span><b>'+PLAN.credits+' on renewal</b></li><li><span>Signed in as</span><b>'+ME.name+'</b></li></ul>'+
      '<section class="section"><h2>Manage</h2><ul class="list"><li><div class="t"><b>Change plan</b><span>See all memberships</span></div><a class="link" href="https://raengfitness.vercel.app/memberships" style="color:var(--ink);text-decoration:none">View</a></li><li><div class="t"><b>Questions about your plan</b><span>Message Alex</span></div><a class="link" href="https://www.instagram.com/alex.kbells/" target="_blank" rel="noopener" style="color:var(--ink);text-decoration:none">Instagram</a></li></ul></section>';
    }
  };

  function render(){
    main.innerHTML='<div class="view">'+views[view]()+'</div>';
    document.querySelectorAll('.tab').forEach((t,i)=>{const on=t.dataset.view===view;t.setAttribute('aria-selected',on);if(on)$('#tabInd').style.transform='translateX('+(i*100)+'%)'});
    document.querySelectorAll('.mnav button').forEach(b=>b.dataset.go===view?b.setAttribute('aria-current','page'):b.removeAttribute('aria-current'));
    renderDrawer();
  }
  function go(v){view=v;try{history.replaceState(null,'','#'+v)}catch(e){location.hash=v}render();closeDrawer();window.scrollTo({top:0,behavior:'smooth'})}

  // Drawer
  const drawer=$('#drawer'),scrim=$('#scrim'),menuBtn=$('#menuBtn');
  function openDrawer(){drawer.classList.add('on');scrim.classList.add('on');drawer.setAttribute('aria-hidden','false');menuBtn.setAttribute('aria-expanded','true')}
  function closeDrawer(){drawer.classList.remove('on');if(!sheet.classList.contains('on'))scrim.classList.remove('on');drawer.setAttribute('aria-hidden','true');menuBtn.setAttribute('aria-expanded','false')}
  menuBtn.addEventListener('click',openDrawer);
  // ---- Left drawer: three layouts to compare ----
  let layout='c';
  const MAP='https://www.google.com/maps/search/?api=1&query=Media%20House%2C%201A%20Dunns%20Wood%20Road%2C%20Cumbernauld%2C%20G67%203EN';
  const IG='https://www.instagram.com/alex.kbells/', SITE='https://raengfitness.vercel.app/';
  const siteLinks=[['classes','Classes'],['memberships','Memberships'],['coaching','1:1 Coaching'],['online-coaching','Online Coaching'],['about','About RAENG']];
  const ico={list:'<path d="M8 6h12M8 12h12M8 18h12M4 6h.01M4 12h.01M4 18h.01"/>',ring:'<circle cx="12" cy="12" r="8"/><path d="M12 4a8 8 0 0 1 8 8h-8z"/>',pin:'<path d="M12 21s7-7 7-12a7 7 0 0 0-14 0c0 5 7 12 7 12z"/><circle cx="12" cy="9" r="2.5"/>',chat:'<path d="M4 5h16v11H9l-5 4z"/>'};
  function renderDrawer(){
    const nx=upcoming()[0], l=left();
    const head='<div class="who"><span class="avatar" aria-hidden="true">N</span><div><b>'+ME.name+'</b><span>'+PLAN.name+' · '+l+' credits left</span></div></div>';
    let h='';
    if(layout==='a'){
      h=head+'<div class="mnav"><button data-go="home"'+(view==='home'?' aria-current="page"':'')+'>Home <span>Next class</span></button><button data-go="book"'+(view==='book'?' aria-current="page"':'')+'>Book a class <span>'+l+' credits</span></button><button data-go="plan"'+(view==='plan'?' aria-current="page"':'')+'>My plan <span>Renews 24 Nov</span></button></div>'+
        '<details><summary>Help</summary><div class="site"><a href="'+IG+'" target="_blank" rel="noopener">Message Alex on Instagram</a><a href="'+MAP+'" target="_blank" rel="noopener">Directions to Media House</a></div></details>'+
        '<details><summary>Website</summary><div class="site">'+siteLinks.map(([p,t])=>'<a href="'+SITE+p+'">'+t+'</a>').join('')+'</div></details>';
    }else if(layout==='b'){
      h=head+'<div class="grp"><h4>Train</h4><button data-go="book">Book a class <span>'+l+' credits</span></button><button data-go="home">My bookings <span>'+upcoming().length+' upcoming</span></button></div>'+
        '<div class="grp"><h4>Membership</h4><button data-go="plan">Plan and credits <span>'+PLAN.name+'</span></button><a href="'+SITE+'memberships">Change plan <span>→</span></a></div>'+
        '<div class="grp"><h4>The club</h4><a href="'+SITE+'classes">Timetable</a><a href="'+SITE+'coaching">1:1 Coaching</a><a href="'+SITE+'online-coaching">Online Coaching</a><a href="'+SITE+'about">About RAENG</a></div>'+
        '<div class="grp" style="border-bottom:0"><h4>Get in touch</h4><a href="'+IG+'" target="_blank" rel="noopener">Message Alex <span>Instagram</span></a><a href="'+MAP+'" target="_blank" rel="noopener">Directions <span>Media House</span></a></div>';
    }else{
      h=head+(nx?'<button class="mini" data-go="home"><small>Next class</small><b>'+fmt(nx,{weekday:'short',day:'numeric',month:'short'})+', '+timeLbl(nx)+'</b><span>'+until(nx)+' · Media House</span></button>':'<div class="mini"><small>Next class</small><b>Nothing booked</b><span>'+l+' credits to use</span></div>')+
        '<button class="bigbook" data-go="book">Book a class</button>'+
        '<div class="tiles"><button class="tile" data-go="home"><svg viewBox="0 0 24 24">'+ico.list+'</svg>My bookings</button><button class="tile" data-go="plan"><svg viewBox="0 0 24 24">'+ico.ring+'</svg>'+l+' credits</button><a class="tile" href="'+MAP+'" target="_blank" rel="noopener"><svg viewBox="0 0 24 24">'+ico.pin+'</svg>Directions</a><a class="tile" href="'+IG+'" target="_blank" rel="noopener"><svg viewBox="0 0 24 24">'+ico.chat+'</svg>Message Alex</a></div>'+
        '<div class="foot-links">'+siteLinks.map(([p,t])=>'<a href="'+SITE+p+'">'+t+'</a>').join('')+'</div>';
    }
    $('#dbody').innerHTML=h;
  }

  // ---- Account menu (top right) ----
  const acct=$('#acct'),av=$('#avatarBtn');
  function placeAcct(){const r=av.getBoundingClientRect();acct.style.top=(r.bottom+10)+'px';acct.style.right=Math.max(12,innerWidth-r.right)+'px'}
  function openAcct(){closeDrawer();placeAcct();acct.classList.add('on');acct.setAttribute('aria-hidden','false');av.setAttribute('aria-expanded','true');acct.querySelector('[role=menuitem]').focus()}
  function closeAcct(){acct.classList.remove('on');acct.setAttribute('aria-hidden','true');av.setAttribute('aria-expanded','false')}
  av.addEventListener('click',e=>{e.stopPropagation();acct.classList.contains('on')?closeAcct():openAcct()});
  document.addEventListener('click',e=>{if(acct.classList.contains('on')&&!acct.contains(e.target)&&e.target!==av)closeAcct()});
  addEventListener('resize',()=>{if(acct.classList.contains('on'))placeAcct()});
  acct.addEventListener('keydown',e=>{const items=[...acct.querySelectorAll('[role=menuitem]')],i=items.indexOf(document.activeElement);if(e.key==='ArrowDown'){e.preventDefault();items[(i+1)%items.length].focus()}if(e.key==='ArrowUp'){e.preventDefault();items[(i-1+items.length)%items.length].focus()}});
  acct.addEventListener('click',e=>{const b=e.target.closest('[data-acct]');if(!b)return;const a=b.dataset.acct;closeAcct();
    if(a==='plan')go('plan');
    else if(a==='out')toast('Signed out (example)');
    else toast({profile:'Profile and details (example)',notify:'Notification settings (example)',cal:'Connect Apple or Google Calendar (example)',security:'Sign-in and security (example)',help:'Help and contact (example)'}[a]);
    av.focus();});

  // Sheet
  const sheet=$('#sheet');let pending=null;
  function openSheet(mode,k){
    pending={mode,k};const d=new Date(k+':00Z');
    $('#sheetEyebrow').textContent=mode==='book'?'Book with a credit':'Cancel booking';
    $('#sheetTitle').textContent=longLbl(d);
    $('#sheetBody').textContent=mode==='book'?'Uses 1 of your '+left()+' credits. Kettlebell training at Media House, Cumbernauld.':'Your place is released for someone else.';
    $('#sheetYes').textContent=mode==='book'?'Book it':'Cancel booking';
    $('#sheetNo').textContent=mode==='book'?'Not now':'Keep it';
    sheet.classList.add('on');scrim.classList.add('on');sheet.setAttribute('aria-hidden','false');$('#sheetYes').focus();
  }
  function closeSheet(){sheet.classList.remove('on');scrim.classList.remove('on');sheet.setAttribute('aria-hidden','true');pending=null}
  $('#sheetNo').addEventListener('click',closeSheet);
  $('#sheetYes').addEventListener('click',()=>{
    if(!pending)return;const d=new Date(pending.k+':00Z');
    if(pending.mode==='book'){booked.add(pending.k);toast('Booked: '+fmt(d,{weekday:'short',day:'numeric',month:'short'})+', '+timeLbl(d))}
    else{booked.delete(pending.k);toast('Booking cancelled')}
    closeSheet();render();
  });
  scrim.addEventListener('click',()=>{closeSheet();closeDrawer()});
  document.addEventListener('keydown',e=>{if(e.key==='Escape'){if(acct.classList.contains('on')){closeAcct();av.focus()}closeSheet();closeDrawer()}});

  // Toast
  let tt;function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('on');clearTimeout(tt);tt=setTimeout(()=>t.classList.remove('on'),2200)}

  // Delegated clicks
  document.addEventListener('click',e=>{
    const t=e.target.closest('[data-view],[data-go],[data-week],[data-slot],[data-cancel],[data-act]');if(!t)return;
    if(t.dataset.view)go(t.dataset.view);
    else if(t.dataset.go)go(t.dataset.go);
    else if(t.dataset.week){week=+t.dataset.week;render()}
    else if(t.dataset.cancel)openSheet('cancel',t.dataset.cancel);
    else if(t.dataset.act==='cal')toast('Calendar file ready (example)');
    else if(t.dataset.slot){
      const k=t.dataset.slot,d=new Date(k+':00Z');
      if(d<=NOW)return;
      if(booked.has(k))openSheet('cancel',k);
      else if(d>PERIOD.end)toast('Opens when your plan renews');
      else if(left()<1)toast('No credits left this period');
      else openSheet('book',k);
    }
  });
  addEventListener('hashchange',()=>{const v=location.hash.slice(1);if(views[v]&&v!==view){view=v;render()}});
  render();
})();
</script>
